  material_dialogs: ^1.1.4
  motion_toast: ^2.11.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pdf: ^3.11.3
  permission_handler: ^11.3.1
  pretty_dio_logger: ^1.4.0
  printing: ^5.14.2
  provider: ^6.1.2
  retrofit: ^4.0.3
  salomon_bottom_bar: ^3.3.2
  share_plus: ^10.1.4
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  shimmer_effect: ^1.0.4
  simple_circular_progress_bar: ^1.0.2
  sqflite: ^2.3.3
  url_launcher: ^6.2.6
  video_player: ^2.8.6
  video_player_win: ^3.1.1  
  # Core
  freezed_annotation: ^2.4.1
  injectable: ^2.4.2
  # Firebase & Auth
  firebase_messaging: ^15.1.6
  # State Management
  bloc: ^9.0.0
  # UI
  connectivity_plus: ^5.0.2
  
  
  # Location & Maps
  # File & Media
  # Utils
  http_parser: ^4.0.2
  logger: ^2.6.0
  ffmpeg_kit_flutter_new: ^3.2.0
  # share_plus: ^12.0.0
  badges: ^3.1.2
  # Routing
  go_router: ^16.2.4
  # Splash
  # Localization
  flutter_localized_locales: ^2.0.0
  # Custom packages
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  translator: ^1.0.4+1
  drift: ^2.28.2
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.29
  percent_indicator: ^4.2.5
  flutter_local_notifications: ^19.4.2
  flutter_background_service_android: ^6.3.1
  workmanager: ^0.9.0+3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  retrofit_generator: ^9.7.0
  injectable_generator: ^2.4.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.4
  mocktail_image_network: ^1.0.0
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  test: ^1.24.9
  bloc_test: 10.0.0
  network_image_mock: ^2.1.1
  intl_utils: ^2.8.11
  version_assist: ^1.3.4
  package_rename: ^1.7.1
  flutter_arb_translator: ^1.0.0
  drift_dev: ^2.28.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/packages/
    - assets/images/onboarding/
    - assets/logos/
    - assets/languages/
  fonts:
    - family: "Tajawal"
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null

flutter_intl:
  enabled: false

flutter_gen:
  output: lib/gen/
