name: mubin_orders
description: "mubin_orders"
publish_to: "none"
version: 1.3.0+4
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  cached_network_image: ^3.3.1
  cached_video_player_plus: ^3.0.3
  camera: ^0.11.1
  chewie: ^1.8.1
  country_flags: ^3.2.0
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  delightful_toast: ^1.1.0
  dio: ^5.8.0+1
  equatable: ^2.0.5
  fancy_shimmer_image: ^2.0.3
  file_picker: ^8.3.7
  firebase_auth: ^5.4.2
  firebase_core: ^3.11.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_localization: ^0.3.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  fluttertoast: ^8.2.12
  font_awesome_flutter: ^10.7.0
  formz: ^0.8.0
  gap: ^3.0.1
  geolocator: ^13.0.2
  get: ^4.6.6
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  hydrated_bloc: ^10.0.0
  image_picker: ^1.1.0
  internet_connection_checker_plus: ^2.7.0
  intl: any
  json_annotation: ^4.9.0
  location: ^8.0.0
  material_dialogs: ^1.1.4
  motion_toast: ^2.11.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pdf: ^3.11.3
  permission_handler: ^11.3.1
  pretty_dio_logger: ^1.4.0
  printing: ^5.14.2
  provider: ^6.1.2
  retrofit: ^4.0.3
  salomon_bottom_bar: ^3.3.2
  share_plus: ^10.1.4
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  shimmer_effect: ^1.0.4
  simple_circular_progress_bar: ^1.0.2
  sqflite: ^2.3.3
  url_launcher: ^6.2.6
  video_player: ^2.8.6
  video_player_win: ^3.1.1
  mode_theme:
    git:
      url: https://github.com/HishamKoptaN/mode_theme.git
      ref: main
  sign_in:
    git:
      url: https://github.com/HishamKoptaN/sign-in.git
      ref: main
  auth:
    git:
      url: https://github.com/HishamKoptaN/auth.git
      ref: main
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  go_router: ^16.2.0
dependency_overrides:
  form_inputs:
    path: G:/packages/form_inputs
  sign_in:
    path: G:/packages/sign_in
  mode_theme:
    path: G:/packages/mode_theme
dev_dependencies:
  flutter_assets: ^0.0.6
  flutter_gen_runner: ^5.4.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  injectable_generator: ^2.3.0
  intl_utils: ^2.5.0
  json_serializable: ^6.7.1
  package_rename: ^1.7.1
  retrofit_generator: ">=8.0.0 <10.0.0"
  # version_assist set --version 2.0.0+1
  version_assist: ^1.3.4
flutter:
  generate: true # Add this line
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/languages/
  fonts:
    - family: "Tajawal"
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null
flutter_intl:
  enabled: false
flutter_gen:
  output: lib/gen/