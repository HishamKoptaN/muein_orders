name: mubin_orders
description: "mubin_orders"
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  retrofit: ^4.0.3
  injectable: ^2.4.2
  dio: ^5.7.0
  get_it: ^8.0.3

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.0.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # State Management
  flutter_bloc: ^9.0.0
  hydrated_bloc: ^10.0.0
  equatable: ^2.0.5
  formz: ^0.8.0

  # UI
  cached_network_image: ^3.3.1
  cached_video_player_plus: ^4.0.4
  camera: ^0.11.1
  chewie: ^1.8.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  fluttertoast: ^8.2.12
  font_awesome_flutter: ^10.7.0
  gap: ^3.0.1
  google_fonts: ^6.2.1
  salomon_bottom_bar: ^3.3.2
  shimmer: ^3.0.0
  shimmer_effect: ^1.0.4
  simple_circular_progress_bar: ^1.0.2

  # Location & Maps
  geolocator: ^11.1.0
  location: ^8.0.0
  google_maps_flutter: ^2.10.0

  # File & Media
  file_picker: ^10.3.3
  image_picker: ^1.1.0
  video_player: ^2.9.1

  # Utils
  internet_connection_checker_plus: ^2.7.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pretty_dio_logger: ^1.4.0
  logger: ^2.6.0
  printing: ^5.14.2
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  share_plus: ^10.1.2
  sqflite: ^2.3.3
  url_launcher: ^6.3.0

  # Other
  delightful_toast: ^1.1.0
  material_dialogs: ^1.1.4
  motion_toast: ^2.11.0
  country_flags: ^4.0.1
  country_picker: ^2.0.27

  # Routing
  go_router: ^14.3.0

  # Splash
  flutter_native_splash: ^2.4.1

  # Localization
  flutter_localization: ^0.3.1
  flutter_localized_locales: ^2.0.0
  intl: ^0.20.1

  # Custom packages
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  # storage_utils:
  #   git:
  #     url: https://github.com/HishamKoptaN/storage_utils.git
  #     ref: main
  shared_preferences: ^2.5.3
dependency_overrides:
  form_inputs:
    path: G:/packages/form_inputs
dev_dependencies:
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.9.2
  retrofit_generator: ^9.1.3
  injectable_generator: ^2.4.2
  flutter_test:
    sdk: flutter
  mockito: ^5.4.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.11
  version_assist: ^1.3.4
  package_rename: ^1.7.1
  integration_test:
    sdk: flutter
flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/
    - assets/logos/
    - assets/languages/
  fonts:
    - family: "Tajawal"
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null

flutter_intl:
  enabled: false

flutter_gen:
  output: lib/gen/
