name: mubin_orders
description: "mubin_orders"
publish_to: "none"
version: 1.3.0+4
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Core
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  retrofit: ^4.0.3
  injectable: ^2.4.2
  dio: ^5.7.0
  get_it: ^8.0.3
  # Firebase & Auth
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  firebase_messaging: ^16.0.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  # State Management
  flutter_bloc: ^9.0.0
  hydrated_bloc: ^10.0.0
  equatable: ^2.0.5
  formz: ^0.8.0
  bloc: ^9.0.0
  # UI
  cached_network_image: ^3.3.1
  cached_video_player_plus: ^4.0.4
  camera: ^0.11.1
  chewie: ^1.8.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  fluttertoast: ^8.2.12
  font_awesome_flutter: ^10.7.0
  gap: ^3.0.1
  google_fonts: ^6.2.1
  salomon_bottom_bar: ^3.3.2
  shimmer: ^3.0.0
  shimmer_effect: ^1.0.4
  simple_circular_progress_bar: ^1.0.2

  # Location & Maps
  geolocator: ^11.1.0
  location: ^8.0.0
  google_maps_flutter: ^2.10.0

  # File & Media
  file_picker: ^10.3.3
  image_picker: ^1.1.0
  video_player: ^2.9.1
  # Utils
  internet_connection_checker_plus: ^2.7.0
  http_parser: ^4.0.2
  path: ^1.9.0
  path_provider: ^2.1.3
  pretty_dio_logger: ^1.4.0
  logger: ^2.6.0
  ffmpeg_kit_flutter_new: ^3.2.0
  printing: ^5.14.2
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  share_plus: ^10.1.2
  sqflite: ^2.3.3
  url_launcher: ^6.3.0
  # Background Services
  workmanager: ^0.9.0+3
  # Routing
  go_router: ^14.3.0
  # Splash
  flutter_native_splash: ^2.4.1
  # Localization
  flutter_localization: ^0.3.1
  flutter_localized_locales: ^2.0.0
  intl: ^0.20.1
  # Custom packages
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  shared_preferences: ^2.5.3
  translator: ^1.0.4+1
  drift: ^2.28.2
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.29
  percent_indicator: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.4.9
  json_serializable: ^6.8.0
  retrofit_generator: ^9.0.0
  injectable_generator: ^2.4.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.4
  mocktail_image_network: ^1.0.0
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.1.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  test: ^1.24.9
  bloc_test: 10.0.0
  network_image_mock: ^2.1.1
  intl_utils: ^2.8.11
  version_assist: ^1.3.4
  package_rename: ^1.7.1
  flutter_arb_translator: ^1.0.0
  drift_dev: ^2.28.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/packages/
    - assets/images/onboarding/
    - assets/logos/
    - assets/test/
    - assets/languages/
  fonts:
    - family: "Tajawal"
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null

flutter_intl:
  enabled: false

flutter_gen:
  output: lib/gen/
