  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.2
  permission_handler: ^13.0.1
  retrofit: ^4.9.0
  rxdart: ^0.28.0
  logger: ^2.6.0
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  freezed_annotation: ^3.1.0
  injectable: ^3.0.0
  json_serializable: ^6.11.2
  cached_network_image: ^3.3.1
  cached_video_player_plus: ^4.1.0
  camera: ^0.12.0+1
  country_flags: ^4.1.0
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.6
  equatable: ^2.0.5
  file_picker: ^12.0.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  flutter_bloc: ^9.0.0
  flutter_localization: ^0.4.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.0.0
  font_awesome_flutter: ^11.0.0
  formz: ^0.8.0
  gap: ^3.0.1
  get: ^4.6.6
  get_it: ^9.2.0
  google_fonts: ^8.0.2
  http: ^1.2.2
  hydrated_bloc: ^11.0.0
  image_picker: ^1.1.0
  internet_connection_checker_plus: ^3.1.1
  intl: any
  location: ^10.0.2
  path_provider: ^2.1.3
  pdf: ^3.11.3
  pretty_dio_logger: ^1.4.0
  printing: ^5.14.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  url_launcher: ^6.2.6
  video_player: ^2.8.6
  firebase_messaging: ^16.5.0
  bloc: ^9.0.0
  connectivity_plus: ^7.3.1
  badges: ^3.1.2
  go_router: ^17.0.1
  flutter_localized_locales: ^2.0.0
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  translator: ^1.0.4+1
  drift: ^2.28.2
  drift_sqflite: ^2.0.1
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.7
  universal_platform: ^1.1.0
  flutter_svg: ^2.0.0
  device_info_plus: ^13.2.0
  skeletonizer: ^2.1.3
  error_handler:
    git:
      url: https://github.com/HishamKoptaN/error_handler.git
      ref: '077ab50'
  latlong2: ^0.10.1
  flutter_map: ^8.3.2
  bloc_concurrency: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  freezed: ^3.2.3
  injectable_generator: ^3.0.2
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.4
  mocktail_image_network: ^1.0.0
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0
  mockito: ^5.4.4
  test: ^1.24.9
  bloc_test: 10.0.0
  network_image_mock: ^2.1.1
  intl_utils: ^2.8.11
  # version_assist: ^1.3.4
  package_rename: ^1.7.1
  flutter_arb_translator: ^1.0.0
  drift_dev: ^2.28.0
  flutter_flavorizr: ^2.2.3
flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/
    - assets/logos/
    - shorebird.yaml
  fonts:
    - family: "Tajawal"
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null

flutter_intl:
  enabled: false

flutter_gen:
  output: lib/gen/