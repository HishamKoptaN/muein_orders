name: mueinorders
description: mueinorders
publish_to: "none"
# Shorebird version format: version+build_number
# Use shorebird release with --build-name and --build-number for precise control
version: 1.1.0+2
environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^6.1.0 
  latlong2: ^0.9.1  
  google_maps_flutter_platform_interface: ^2.4.0 
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  retrofit: ^4.9.0
  logger: ^2.6.0
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  freezed_annotation: ^3.1.0
  injectable: ^2.4.2
  json_serializable: ^6.11.2
  adaptive_theme: ^3.7.0
  cached_network_image: ^3.3.1
  cached_video_player_plus: ^4.1.0
  camera: ^0.11.1
  chewie: ^1.8.1
  country_flags: ^4.1.0
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.6
  delightful_toast: ^1.1.0
  equatable: ^2.0.5
  fancy_shimmer_image: ^2.0.3
  file_picker: ^10.3.8
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  flutter_bloc: ^9.0.0
  flutter_localization: ^0.3.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: 8.1.0
  flutter_svg: ^2.0.17
  fluttertoast: ^9.0.0
  font_awesome_flutter: ^10.7.0
  formz: ^0.8.0
  gap: ^3.0.1
  get: ^4.6.6
  get_it: ^9.2.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  hydrated_bloc: ^10.0.0
  image_picker: ^1.1.0
  internet_connection_checker_plus: ^2.2.0
  intl: any
  location: ^8.0.0
  material_dialogs: ^1.1.4
  motion_toast: ^2.11.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pdf: ^3.11.3
  pretty_dio_logger: ^1.4.0
  printing: ^5.14.2
  provider: ^6.1.2
  share_plus: ^12.0.1
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  shimmer_effect: ^1.0.4
  simple_circular_progress_bar: ^1.0.2
  sqflite: ^2.3.3
  url_launcher: ^6.2.6
  video_player: ^2.8.6
  video_player_win: ^3.1.1  
  firebase_messaging: ^15.2.5
  bloc: ^9.0.0
  connectivity_plus: ^7.0.0
  http_parser: ^4.0.2
  badges: ^3.1.2
  go_router: ^17.0.1
  flutter_localized_locales: ^2.0.0
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  translator: ^1.0.4+1
  drift: ^2.28.2
  drift_sqflite: ^2.0.1
  app_links: ^6.3.2
  percent_indicator: ^4.2.5
  flutter_local_notifications: ^19.4.2
  flutter_background_service_android: ^6.3.1
  workmanager: ^0.9.0+3
  universal_platform: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  freezed: ^3.2.3
  injectable_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.4
  mocktail_image_network: ^1.0.0
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0
  mockito: ^5.4.4
  test: ^1.24.9
  bloc_test: 10.0.0
  network_image_mock: ^2.1.1
  intl_utils: ^2.8.11
  version_assist: ^1.3.4
  package_rename: ^1.7.1
  flutter_arb_translator: ^1.0.0
  drift_dev: ^2.28.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/
    - assets/logos/
    - shorebird.yaml
  fonts:
    - family: "Tajawal"
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null

flutter_intl:
  enabled: false

flutter_gen:
  output: lib/gen/
