# Flutter Native Splash Configuration
# لتشغيل: flutter pub run flutter_native_splash:create --path=flutter_native_splash.yaml

flutter_native_splash:
  # الألوان الأساسية
  color: "#003A45"
  color_dark: "#003A45"

  # صورة الخلفية
  background_image: assets/images/splash.png

  # إعدادات المحاذاة والملء
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web_image_mode: cover

  # إعدادات Android 12+ (لون فقط لتجنب الشاشة السوداء)
  android_12:
    color: "#003A45"
    color_dark: "#003A45"

  # تفعيل جميع المنصات
  android: true
  ios: true
  web: true