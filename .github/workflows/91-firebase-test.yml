name: Firebase Connection Test

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

permissions:
  contents: read

jobs:
  test-firebase-connection:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: 🔍 Check Firebase Config
        id: config
        run: |
          echo "## 🔍 Firebase Configuration Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Debug: Show environment info
          echo "**Environment:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**FIREBASE_TOKEN exists:** ${{ env.FIREBASE_TOKEN != '' }}" >> $GITHUB_STEP_SUMMARY
          echo "**FIREBASE_ADMIN_SDK exists:** ${{ env.FIREBASE_ADMIN_SDK != '' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check Firebase options file
          if [ -f "lib/config/firebase/dev/firebase_options.dart" ]; then
            echo "✅ Firebase config file exists" >> $GITHUB_STEP_SUMMARY
            APP_ID=$(sed -n '/static const FirebaseOptions android/,/);/p' "lib/config/firebase/dev/firebase_options.dart" | grep "appId:" | sed "s/.*'\([^']*\)'.*/\1/")
            echo "**App ID:** $APP_ID" >> $GITHUB_STEP_SUMMARY
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ Firebase config file not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 🔑 Test FIREBASE_TOKEN
        id: token
        run: |
          echo "## 🔑 Testing FIREBASE_TOKEN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "✅ FIREBASE_TOKEN secret exists" >> $GITHUB_STEP_SUMMARY
            echo "✅ FIREBASE_TOKEN authentication will use direct token method" >> $GITHUB_STEP_SUMMARY
            # Note: FIREBASE_TOKEN is deprecated, but checking if value exists
            # Use service account instead if available
            echo "token_auth=exists" >> $GITHUB_OUTPUT
          else
            echo "❌ FIREBASE_TOKEN secret is missing" >> $GITHUB_STEP_SUMMARY
            echo "token_auth=missing" >> $GITHUB_OUTPUT
          fi

      - name: 📄 Test FIREBASE_ADMIN_SDK
        id: service-account
        run: |
          echo "## 📄 Testing FIREBASE_ADMIN_SDK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$FIREBASE_ADMIN_SDK" ] && [ "$FIREBASE_ADMIN_SDK" != "" ]; then
            echo "✅ FIREBASE_ADMIN_SDK secret exists" >> $GITHUB_STEP_SUMMARY
            
            # Save service account to file
            echo "$FIREBASE_ADMIN_SDK" > service-account.json
            
            # Verify JSON format
            if python3 -c "import json; json.load(open('service-account.json'))" 2>/dev/null || python -c "import json; json.load(open('service-account.json'))" 2>/dev/null; then
              echo "✅ Service account JSON is valid" >> $GITHUB_STEP_SUMMARY
              echo "service_account_auth=success" >> $GITHUB_OUTPUT
            else
              echo "❌ Service account JSON is invalid" >> $GITHUB_STEP_SUMMARY
              echo "service_account_auth=invalid" >> $GITHUB_OUTPUT
            fi
            
            # Clean up
            rm -f service-account.json
          else
            echo "❌ FIREBASE_ADMIN_SDK secret is missing" >> $GITHUB_STEP_SUMMARY
            echo "service_account_auth=missing" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build Test APK
        id: build
        run: |
          echo "## 🏗️ Building Test APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Disable Gradle daemon to prevent crashes in CI
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

          # Build APK for testing
          if flutter build apk --flavor dev --debug; then
            echo "✅ APK build successful" >> $GITHUB_STEP_SUMMARY
            echo "**APK Path:** build/app/outputs/flutter-apk/app-dev-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "apk_path=build/app/outputs/flutter-apk/app-dev-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "❌ APK build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 📱 Test Firebase Distribution
        id: distribution
        run: |
          echo "## 📱 Testing Firebase Distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "build/app/outputs/flutter-apk/app-dev-debug.apk" ]; then
            echo "✅ APK file found for distribution test" >> $GITHUB_STEP_SUMMARY
            echo "apk_ready=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No APK file found for distribution test" >> $GITHUB_STEP_SUMMARY
            echo "apk_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Summary & Recommendations
        run: |
          echo "## 📋 Test Summary & Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOKEN_STATUS="${{ steps.token.outputs.token_auth }}"
          SA_STATUS="${{ steps.service-account.outputs.service_account_auth }}"

          echo "### 🔍 Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **FIREBASE_TOKEN:** $TOKEN_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **FIREBASE_ADMIN_SDK:** $SA_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Build:** ${{ steps.build.outputs.apk_path != '' && 'Success' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🛠️ Recommendations:" >> $GITHUB_STEP_SUMMARY
          if [ "$TOKEN_STATUS" != "exists" ] && [ "$SA_STATUS" != "success" ]; then
            echo "❌ Both authentication methods unavailable." >> $GITHUB_STEP_SUMMARY
            echo "- FIREBASE_TOKEN exists but deprecated." >> $GITHUB_STEP_SUMMARY
            echo "- FIREBASE_ADMIN_SDK is missing from environment '${{ github.ref_name }}'." >> $GITHUB_STEP_SUMMARY
          elif [ "$SA_STATUS" == "success" ]; then
            echo "✅ Use FIREBASE_ADMIN_SDK (Service Account) in your main workflow" >> $GITHUB_STEP_SUMMARY
            echo "   - Recommended: More secure than FIREBASE_TOKEN" >> $GITHUB_STEP_SUMMARY
          elif [ "$TOKEN_STATUS" == "exists" ]; then
            echo "⚠️ Only FIREBASE_TOKEN available (deprecated but functional)" >> $GITHUB_STEP_SUMMARY
            echo "   - Recommended: Add FIREBASE_ADMIN_SDK for better security" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔧 How to Add Missing Secrets to Environment '${{ github.ref_name }}':" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to: Settings → Environments → ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Click 'Add secret'" >> $GITHUB_STEP_SUMMARY
          echo "3. Name: \\"FIREBASE_ADMIN_SDK\\"" >> $GITHUB_STEP_SUMMARY
          echo "4. Value: Paste your Firebase Service Account JSON key" >> $GITHUB_STEP_SUMMARY
          echo "5. Repeat for FIREBASE_TOKEN if needed" >> $GITHUB_STEP_SUMMARY
