name: Shorebird Android

on:
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      version_name:
        type: string
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - uses: shorebirdtech/setup-shorebird@v1
      - run: |
          if [ "${{ inputs.action }}" == "patch" ]; then
            shorebird patch android --flavor=prod --release-version="${{ inputs.version_name }}"
          else
            shorebird release android --flavor=prod --release-version="${{ inputs.version_name }}"
          fi
