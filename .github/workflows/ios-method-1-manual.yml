name: iOS Method 1 - Manual Signing
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      flutter_version:
        required: false
        type: string
        default: "3.41.2"
    outputs:
      status:
        value: ${{ jobs.build.outputs.status }}
      ipa_path:
        value: ${{ jobs.build.outputs.ipa_path }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      status: ${{ steps.build.outputs.status }}
      ipa_path: ${{ steps.build.outputs.ipa_path }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Certificates
        run: |
          CERTS_DIR="${{ github.workspace }}"
          security create-keychain -p "temp123" "build.keychain"
          security unlock-keychain -p "temp123" "build.keychain"
          security list-keychains -d user -s "build.keychain" $(security list-keychains -d user | tr -d '"')

          if [ -f "$CERTS_DIR/certificate.p12" ]; then
            security import "$CERTS_DIR/certificate.p12" -k "build.keychain" \
              -P "${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }}" -T /usr/bin/codesign || true
          elif [ -f "$CERTS_DIR/distribution.pem" ] && [ -f "$CERTS_DIR/private.key" ]; then
            openssl pkcs12 -export -out /tmp/cert.p12 -inkey "$CERTS_DIR/private.key" \
              -in "$CERTS_DIR/distribution.pem" -password pass:"temp123"
            security import /tmp/cert.p12 -k "build.keychain" -P "temp123" -T /usr/bin/codesign || true
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "temp123" "build.keychain" || true

          PP_FILE=$(find "$CERTS_DIR" -maxdepth 1 -name "*.mobileprovision" -print -quit)
          if [ -f "$PP_FILE" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PP_UUID=$(security cms -D -i "$PP_FILE" | plutil -extract UUID raw -)
            cp "$PP_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"

      - uses: shorebirdtech/setup-shorebird@v1
      - run: flutter pub get
      - run: cd ios && pod install --repo-update

      - name: 📝 Update ExportOptions.plist
        run: |
          PP_NAME=$(security cms -D -i ${{ github.workspace }}/*.mobileprovision 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "")
          plutil -replace provisioningProfiles.com.muein.orders -string "$PP_NAME" ios/ExportOptions.plist 2>/dev/null || true

      - name: 📦 Build with Shorebird
        id: build
        continue-on-error: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release ios \
            --flutter-version=${{ inputs.flutter_version }} \
            --dart-define=ENV=prod --flavor=prod \
            --export-options-plist=ios/ExportOptions.plist && {
              echo "status=success" >> $GITHUB_OUTPUT
              echo "ipa_path=build/ios/ipa/*.ipa" >> $GITHUB_OUTPUT
            } || echo "status=failed" >> $GITHUB_OUTPUT
