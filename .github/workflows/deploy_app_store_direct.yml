name: Deploy to App Store
on:
  push:
    branches:
      - prods
  workflow_dispatch:
jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION_CODE=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml | grep -oP '\+\K[0-9]+' || echo "1")
          VERSION_NAME=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "📱 الإصدار: $VERSION_NAME+$VERSION_CODE"
  release:
    needs: get-version
    uses: ./.github/workflows/shorebird_release_ios.yml
    with:
      version_code: ${{ needs.get-version.outputs.version_code }}
      version_name: ${{ needs.get-version.outputs.version_name }}
      track: testflight
    secrets: inherit
