name: iOS Release - Fallback Orchestrator
on:
  workflow_dispatch:
    inputs:
      version_code:
        required: true
        type: string
        description: "رقم الإصدار (مثال: 42)"
      version_name:
        required: true
        type: string
        description: "اسم الإصدار (مثال: 1.2.3)"
      track:
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: "testflight"
        description: "القناة"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # METHOD 1: Manual Signing
  # ═══════════════════════════════════════════════════════════════
  method-1-manual:
    name: "Method 1: Manual"
    uses: ./.github/workflows/ios-method-1-manual.yml
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}

  # ═══════════════════════════════════════════════════════════════
  # METHOD 2: Automatic Signing
  # ═══════════════════════════════════════════════════════════════
  method-2-automatic:
    name: "Method 2: Automatic"
    uses: ./.github/workflows/ios-method-2-automatic.yml
    needs: method-1-manual
    if: needs.method-1-manual.outputs.status != 'success'
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}

  # ═══════════════════════════════════════════════════════════════
  # METHOD 3: Fastlane Match
  # ═══════════════════════════════════════════════════════════════
  method-3-fastlane:
    name: "Method 3: Fastlane"
    uses: ./.github/workflows/ios-method-3-fastlane.yml
    needs: [method-1-manual, method-2-automatic]
    if: needs.method-1-manual.outputs.status != 'success' && needs.method-2-automatic.outputs.status != 'success'
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}

  # ═══════════════════════════════════════════════════════════════
  # METHOD 4: Direct Flutter Build
  # ═══════════════════════════════════════════════════════════════
  method-4-direct:
    name: "Method 4: Direct"
    uses: ./.github/workflows/ios-method-4-direct.yml
    needs: [method-1-manual, method-2-automatic, method-3-fastlane]
    if: needs.method-1-manual.outputs.status != 'success' && needs.method-2-automatic.outputs.status != 'success' && needs.method-3-fastlane.outputs.status != 'success'
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}

  # ═══════════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs:
      [method-1-manual, method-2-automatic, method-3-fastlane, method-4-direct]
    if: always()
    steps:
      - name: 📊 Results
        run: |
          echo "=== iOS Release Results ==="
          echo "Method 1 (Manual): ${{ needs.method-1-manual.outputs.status }}"
          echo "Method 2 (Automatic): ${{ needs.method-2-automatic.outputs.status }}"
          echo "Method 3 (Fastlane): ${{ needs.method-3-fastlane.outputs.status }}"
          echo "Method 4 (Direct): ${{ needs.method-4-direct.outputs.status }}"
          if [ "${{ needs.method-1-manual.outputs.status }}" == "success" ] || \
             [ "${{ needs.method-2-automatic.outputs.status }}" == "success" ] || \
             [ "${{ needs.method-3-fastlane.outputs.status }}" == "success" ] || \
             [ "${{ needs.method-4-direct.outputs.status }}" == "success" ]; then
            echo "✅ SUCCESS: One or more methods succeeded"
            exit 0
          else
            echo "❌ FAILURE: All methods failed"
            exit 1
          fi
