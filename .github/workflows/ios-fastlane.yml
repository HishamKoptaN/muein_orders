name: iOS Release - Fastlane (Match)
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
  workflow_dispatch:
    inputs:
      version_code:
        required: true
        type: string
        description: "رقم الإصدار (مثال: 42)"
      version_name:
        required: true
        type: string
        description: "اسم الإصدار (مثال: 1.2.3)"
      track:
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: "testflight"
        description: "القناة"

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: 🔧 Install Fastlane
        run: gem install fastlane

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update

      - name: 📦 Build & Release with Fastlane
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          # Match secrets
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID || 'com.muein.orders' }}
          # App Store Connect API
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          cd ios
          if [ "${{ inputs.track }}" == "testflight" ]; then
            fastlane beta
          else
            fastlane release
          fi
