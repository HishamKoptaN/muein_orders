name: Test Google Play Connection

on:
  push:
    branches: [prod]
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى أردت من زر Run workflow

jobs:
  test_play_auth:
    runs-on: ubuntu-latest
    environment: prod # لاستدعاء أسرار بيئة الـ prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate and Test Google Play Connection
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: com.muein.orders
          # نستخدم ملف وهمي صغير جداً أو حزمة تجريبية فقط لفحص المصادقة والاتصال بالـ API
          releaseFiles: unused_dummy_file.aab 
          track: internal
          status: draft
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          changesNotSentForReview: true