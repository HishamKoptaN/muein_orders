name: Test & Dry-Run Pipeline

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Target track for testing'
        required: false
        default: 'internal'
        type: string

jobs:
  test_environment:
    runs-on: ubuntu-latest
    environment: prod 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 1. Verify Secrets Availability
        run: |
          echo "Checking GitHub Secrets..."
          if [ -z "${{ secrets.SHOREBIRD_TOKEN }}" ]; then
            echo "❌ SHOREBIRD_TOKEN is missing or empty!"
            exit 1
          else
            echo "✅ SHOREBIRD_TOKEN is configured correctly."
          fi

          if [ -z "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "❌ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing or empty!"
            exit 1
          else
            echo "✅ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is configured correctly."
          fi

      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: 3. Setup Shorebird & Verify Auth
        uses: shorebirdtech/setup-shorebird@v1
        with:
          token: ${{ secrets.SHOREBIRD_TOKEN }}
          cache: true

      - name: 4. Check Shorebird Account Status
        run: shorebird account
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: 5. Test Dry-Run Build (AAB)
        run: |
          echo "Starting dry-run build for prod flavor..."
          flutter build appbundle \
            --flavor=prod \
            --dart-define=ENV=prod \
            --pub
          echo "✅ Build test passed successfully! AAB bundle generated safely."