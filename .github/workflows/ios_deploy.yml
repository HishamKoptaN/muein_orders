name: iOS Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      force_release:
        type: boolean
        default: false
      force_patch:
        type: boolean
        default: false

env:
  WEBHOOK: "https://api.codemagic.io/hooks/69e22d0468ccd4f8805e9a4b"
  APP_ID: "6761682256"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.decide.outputs.type }}
      version: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "name=$(echo $V | cut -d'+' -f1)" >> $GITHUB_OUTPUT
          echo "code=$(echo $V | cut -d'+' -f2)" >> $GITHUB_OUTPUT

      - id: native
        run: |
          PATHS="ios/ android/ linux/ macos/ windows/ web/"
          PREV=$(git rev-parse HEAD~1)
          HAS=false
          for p in $PATHS; do
            git diff --name-only $PREV HEAD | grep -q "^$p" && HAS=true
          done
          echo "has=$HAS" >> $GITHUB_OUTPUT

      - id: decide
        run: |
          CODE="${{ steps.ver.outputs.code }}"
          NATIVE="${{ steps.native.outputs.has }}"
          FORCE_R="${{ github.event.inputs.force_release }}"
          FORCE_P="${{ github.event.inputs.force_patch }}"

          if [[ "$FORCE_R" == "true" ]]; then
            TYPE="release"
          elif [[ "$FORCE_P" == "true" ]]; then
            TYPE="patch"
          elif [[ "$CODE" == "1" ]] || [[ "$NATIVE" == "true" ]]; then
            TYPE="release"
          else
            TYPE="patch"
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Build: $TYPE"

  codemagic:
    needs: detect
    if: needs.detect.outputs.type == 'release'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"branch":"${{ github.ref_name }}","commit":"${{ github.sha }}","type":"release","version":"${{ needs.detect.outputs.version }}"}' \
            "$WEBHOOK"
          echo "Codemagic triggered"

  shorebird:
    needs: detect
    if: needs.detect.outputs.type == 'patch'
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.41.2", channel: "stable" }
      - uses: shorebirdtech/setup-shorebird@v1

      - run: |
          echo "$SHOREBIRD_TOKEN" > ~/.shorebird_token
          shorebird login --token "$SHOREBIRD_TOKEN"

      - run: flutter pub get
      - run: cd ios && pod install

      - run: shorebird patch --platforms=ios --release-version="${{ needs.detect.outputs.version }}"

  summary:
    runs-on: ubuntu-latest
    needs: [detect, codemagic, shorebird]
    if: always()
    steps:
      - run: |
          echo "Type: ${{ needs.detect.outputs.type }}"
          echo "Version: ${{ needs.detect.outputs.version }}+${{ needs.detect.outputs.code }}"
