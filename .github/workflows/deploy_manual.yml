name: Deploy iOS (Manual)
on:
  workflow_call:
    inputs:
      track:
        description: "App Store track"
        required: true
        default: "testflight"
        type: string
      action:
        description: "Action type"
        required: true
        default: "release"
        type: string
      version_name:
        description: "Version name"
        required: true
        type: string
      version_code:
        description: "Version code"
        required: true
        type: string

jobs:
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: 📦 Get Packages
        run: flutter pub get

      - name: 🍏 Setup iOS
        run: |
          cd ios
          pod install

      - name: 🔨 Build iOS
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $PWD/build/Runner.xcarchive \
            archive

      - name: 📤 Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: 📋 Build Info
        run: |
          echo "📱 تم بناء التطبيق بنجاح!"
          echo "   الإصدار: ${{ inputs.version_name }}"
          echo "   الإجراء: ${{ inputs.action }}"
          echo "   المسار: ios/build/"
