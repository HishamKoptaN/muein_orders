name: Shorebird Release iOS (Temp - Merged)
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
  workflow_dispatch:
    inputs:
      version_code:
        required: true
        type: string
        description: "رقم الإصدار (مثال: 42)"
      version_name:
        required: true
        type: string
        description: "اسم الإصدار (مثال: 1.2.3)"
      track:
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: "testflight"
        description: "القناة"
      signing_method:
        required: true
        type: choice
        options:
          - manual
          - automatic
        default: "manual"
        description: "طريقة التوقيع: manual (مع ExportOptions.plist) أو automatic (App Store Connect API)"

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Certificates & Provisioning Profile
        run: |
          echo "🔧 Installing certificates from repo root..."
          CERTS_DIR="${{ github.workspace }}"

          # Create keychain
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="temp123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

          # Install Certificate
          if [ -f "$CERTS_DIR/certificate.p12" ]; then
            echo "📜 Installing certificate.p12..."
            security import "$CERTS_DIR/certificate.p12" -k "$KEYCHAIN_NAME" \
              -P "${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }}" -T /usr/bin/codesign || true
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
          else
            echo "⚠️ No certificate.p12 found"
          fi

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_FILE=$(find "$CERTS_DIR" -maxdepth 1 -name "*.mobileprovision" -print -quit)
          if [ -f "$PP_FILE" ]; then
            PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_FILE")")
            PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PP_FILE")")
            cp "$PP_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
            echo "provisioning_profile_name=$PP_NAME" >> $GITHUB_ENV
            echo "✅ Installed: $PP_NAME (UUID: $PP_UUID)"
          fi

      - uses: actions/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: 🔐 Setup App Store Connect API Key
        id: api_key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          echo "path=$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" >> $GITHUB_OUTPUT
          echo "key_id=${{ secrets.APP_STORE_CONNECT_KEY_ID }}" >> $GITHUB_OUTPUT
          echo "issuer_id=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_OUTPUT
          echo "✅ API Key configured"

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1

      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update

      - name: 📦 Build with Shorebird (Automatic Signing)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          # App Store Connect API for automatic signing
          APP_STORE_CONNECT_API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          APP_STORE_CONNECT_KEY_ID: ${{ steps.api_key.outputs.key_id }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.api_key.outputs.issuer_id }}
        run: |
          echo "📦 Building Shorebird iOS with Automatic Signing..."
          echo "   API Key ID: ${{ steps.api_key.outputs.key_id }}"
          echo "   Provisioning Profile: $provisioning_profile_name"
          shorebird release ios \
            --flutter-version=3.41.2 \
            --dart-define=ENV=prod \
            --flavor=prod

      - name: 📤 Upload to App Store
        run: |
          echo "📤 Uploading to ${{ inputs.track }}..."
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "${{ steps.api_key.outputs.key_id }}" \
            --apiIssuer "${{ steps.api_key.outputs.issuer_id }}" \
            --verbose || true
