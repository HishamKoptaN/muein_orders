name: Shorebird Release iOS
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-macos
          restore-keys: flutter-deps-

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/.symlinks
            ~/Library/Developer/Xcode/DerivedData
          key: ios-deps-${{ hashFiles('ios/Podfile.lock') }}-macos
          restore-keys: ios-deps-macos-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-macos-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-macos-
      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/build
          key: ios-build-${{ github.sha }}-${{ inputs.version_code }}-macos
          restore-keys: ios-build-macos-
      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update

      - name: 🔧 Install Certificate & Provisioning Profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "🔧 Installing iOS Certificate & Provisioning Profile..."

          # Create keychain
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="temp123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

          # Install Certificate
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            echo "📜 Installing certificate..."
            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
            security import /tmp/certificate.p12 -k "$KEYCHAIN_NAME" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security || true
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
            echo "✅ Certificate installed"
          else
            echo "⚠️ IOS_CERTIFICATE_BASE64 not set"
          fi

          # Install Provisioning Profile
          if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "📋 Installing provisioning profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build_profile.mobileprovision
            echo "✅ Provisioning profile installed"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

            # Extract UUID from provisioning profile and set as env var
            PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/build_profile.mobileprovision)")
            echo "📋 Provisioning Profile UUID: $PP_UUID"
            echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          else
            echo "⚠️ IOS_PROVISIONING_PROFILE_BASE64 not set"
            echo "❌ Manual signing requires IOS_PROVISIONING_PROFILE_BASE64 secret"
            exit 1
          fi
      - env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          echo "🔐 إعداد App Store Connect API Key..."
          # Debug: التحقق من وجود Secrets
          echo "🔍 التحقق من Secrets..."
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then echo "❌ APP_STORE_CONNECT_API_KEY_BASE64 غير موجود!"; exit 1; fi
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then echo "❌ APP_STORE_CONNECT_ISSUER_ID غير موجود!"; exit 1; fi
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ]; then echo "❌ APP_STORE_CONNECT_KEY_ID غير موجود!"; exit 1; fi
          echo "✅ جميع Secrets موجودة"
          # إنشاء ملف API Key (يُستخدم لرفع الـ IPA فقط)
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          # تعيين متغيرات البيئة
          echo "APP_STORE_CONNECT_API_KEY_PATH=$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_KEY_ID=${APP_STORE_CONNECT_KEY_ID}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID=${APP_STORE_CONNECT_ISSUER_ID}" >> $GITHUB_ENV
          echo "✅ تم إعداد App Store Connect API Key"

      - env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PROVISIONING_PROFILE_UUID: ${{ env.PROVISIONING_PROFILE_UUID }}
        run: |
          echo "📦 إنشاء Shorebird Release iOS..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   استخدام Manual Code Signing..."
          echo "   Provisioning Profile UUID: $PROVISIONING_PROFILE_UUID"

          # استبدال الـ UUID في ExportOptions.plist
          sed -i '' "s/\$(PROVISIONING_PROFILE_UUID)/$PROVISIONING_PROFILE_UUID/g" ios/ExportOptions.plist
          echo "✅ تم تحديث ExportOptions.plist بالـ UUID"

          shorebird release ios \
            --flutter-version=3.41.2 \
            --dart-define=ENV=prod \
            --flavor=prod \
            --export-options-plist=ios/ExportOptions.plist

      - env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_KEY_ID: ${{ env.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ env.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "📤 رفع إلى App Store Connect..."
          echo "   القناة: $TRACK"

          # استخدام نفس ملف الـ API Key
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

          echo "✅ تم إنشاء الإصدار ورفعه بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   القناة: $TRACK"
