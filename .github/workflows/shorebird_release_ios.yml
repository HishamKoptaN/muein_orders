name: Shorebird Release iOS (Secrets)
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
  workflow_dispatch:
    inputs:
      version_code:
        required: true
        type: string
        description: "رقم الإصدار (مثال: 42)"
      version_name:
        required: true
        type: string
        description: "اسم الإصدار (مثال: 1.2.3)"
      track:
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: "testflight"
        description: "القناة"

jobs:
  setup-env:
    uses: ./.github/workflows/ios-setup-env.yml
    with:
      flutter_version: "3.41.2"

  setup-certs:
    uses: ./.github/workflows/ios-setup-certs.yml
    needs: setup-env

  setup-api:
    uses: ./.github/workflows/ios-setup-api-key.yml
    needs: setup-env
    secrets:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  build:
    uses: ./.github/workflows/ios-build-shorebird.yml
    needs: [setup-certs, setup-api]
    with:
      flutter_version: "3.41.2"
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      provisioning_profile_name: ${{ needs.setup-certs.outputs.provisioning_profile_name }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  upload:
    uses: ./.github/workflows/ios-upload-appstore.yml
    needs: [build, setup-api]
    with:
      track: ${{ inputs.track }}
      api_key_path: ${{ needs.setup-api.outputs.api_key_path }}
      key_id: ${{ needs.setup-api.outputs.key_id }}
      issuer_id: ${{ needs.setup-api.outputs.issuer_id }}
