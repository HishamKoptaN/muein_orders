name: Shorebird Release iOS
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-macos
          restore-keys: flutter-deps-

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/.symlinks
            ~/Library/Developer/Xcode/DerivedData
          key: ios-deps-${{ hashFiles('ios/Podfile.lock') }}-macos
          restore-keys: ios-deps-macos-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-macos-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-macos-

      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/build
          key: ios-build-${{ github.sha }}-${{ inputs.version_code }}-macos
          restore-keys: ios-build-macos-

      - run: flutter pub get

      - run: |
          cd ios
          pod install --repo-update

      - name: Install Apple Certificate (Manual Way)
        env:
          CERT_P12: ${{ secrets.APP_STORE_CERTIFICATE_P12 }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "🔐 إعداد توقيع iOS..."

          # 1. إنشاء ملف الشهادة من السيكرت
          echo "$CERT_P12" | base64 --decode > certificate.p12

          # 2. إنشاء Keychain مؤقت وتفعيله
          security create-keychain -p "build_pass" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build_pass" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # 3. استيراد الشهادة
          security import certificate.p12 -k build.keychain -P "$CERT_PASS" -A -T /usr/bin/codesign -T /usr/bin/security || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "build_pass" build.keychain

          echo "✅ تم إعداد الشهادة بنجاح"

      - name: Install Provisioning Profile (Manual Way)
        env:
          PROFILE_DATA: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "📋 تثبيت Provisioning Profile..."

          # فك تشفير البروفايل ووضعه في المجلد المخصص
          if [ -n "$PROFILE_DATA" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROFILE_DATA" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app_store.mobileprovision
            echo "✅ تم تثبيت Provisioning Profile"
          else
            echo "⚠️ لا يوجد Provisioning Profile في Secrets - سيتم استخدام match أو التوقيع التلقائي"
          fi

      - name: Build IPA with Shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

        run: |
          echo "📦 إنشاء Shorebird Release iOS..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"

          shorebird release ios \
            --dart-define=ENV=prod \
            --flavor=prod \
            --artifact=ipa

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          echo "📤 رفع إلى App Store Connect..."
          echo "   القناة: $TRACK"

          # إنشاء ملف API Key مؤقت
          echo "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8

          # رفع الـ IPA
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

          # حذف ملف API Key
          rm /tmp/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8

          echo "✅ تم إنشاء الإصدار ورفعه بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   القناة: $TRACK"
