name: Shorebird Release iOS
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-macos
          restore-keys: flutter-deps-

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/.symlinks
            ~/Library/Developer/Xcode/DerivedData
          key: ios-deps-${{ hashFiles('ios/Podfile.lock') }}-macos
          restore-keys: ios-deps-macos-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-macos-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-macos-

      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/build
          key: ios-build-${{ github.sha }}-${{ inputs.version_code }}-macos
          restore-keys: ios-build-macos-

      - run: flutter pub get

      - run: |
          cd ios
          pod install --repo-update

      - env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "🔐 إعداد شهادة التوقيع (Manual Signing)..."

          # Debug: التحقق من وجود Secrets (بدون عرض المحتوى)
          echo "🔍 التحقق من Secrets..."
          if [ -z "$P12_BASE64" ]; then echo "❌ IOS_P12_BASE64 غير موجود!"; exit 1; fi
          if [ -z "$P12_PASSWORD" ]; then echo "❌ IOS_P12_PASSWORD غير موجود!"; exit 1; fi
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then echo "❌ IOS_PROVISIONING_PROFILE_BASE64 غير موجود!"; exit 1; fi
          echo "✅ جميع Secrets موجودة"

          # إنشاء Keychain مؤقت
          KEYCHAIN_PATH="$RUNNER_TEMP/keychain.keychain"
          KEYCHAIN_PASSWORD="temp_password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # استيراد الشهادة
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign || {
            echo "❌ فشل استيراد الشهادة!"
            exit 1
          }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # تثبيت Provisioning Profile (بحفظه بـ UUID كاسم ملف)
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          # استخراج UUID من الـ profile
          UUID=$(security cms -D -i profile.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || echo "")

          if [ -z "$UUID" ]; then
            echo "⚠️ لم يتم العثور على UUID، سيتم استخدام اسم افتراضي"
            UUID="profile"
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

          echo "✅ Provisioning Profile UUID: $UUID"

          # تفعيل Keychain
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Debug: التحقق من الإعدادات
          echo "🔍 التحقق من الشهادات المتاحة:"
          security find-identity -v -p codesigning || true
          echo "🔍 التحقق من Provisioning Profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true

          echo "✅ تم إعداد الشهادة و Provisioning Profile"

      - env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "📦 إنشاء Shorebird Release iOS..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   استخدام Manual Code Signing..."

          shorebird release ios \
            --flutter-version=3.41.2 \
            --dart-define=ENV=prod \
            --flavor=prod \
            -- \
            --export-options-plist=ios/ExportOptions.plist

      - env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          echo "📤 رفع إلى App Store Connect..."
          echo "   القناة: $TRACK"

          # استخدام نفس ملف الـ API Key
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

          echo "✅ تم إنشاء الإصدار ورفعه بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   القناة: $TRACK"
