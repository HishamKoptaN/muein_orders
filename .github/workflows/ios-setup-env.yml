name: iOS Setup Environment
on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: string
        default: "3.41.2"

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-${{ inputs.flutter_version }}-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-macos
          restore-keys: flutter-deps-

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/.symlinks
            ~/Library/Developer/Xcode/DerivedData
          key: ios-deps-${{ hashFiles('ios/Podfile.lock') }}-macos
          restore-keys: ios-deps-macos-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-macos-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-macos-

      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/build
          key: ios-build-${{ github.sha }}-macos
          restore-keys: ios-build-macos-

      - run: flutter pub get

      - run: |
          cd ios
          pod install --repo-update
