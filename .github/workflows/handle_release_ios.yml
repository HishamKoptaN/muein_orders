name: Handle Release iOS
on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
        description: "Either 'release' or 'bump-and-release'"
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: false
        type: string
        default: "testflight"

jobs:
  bump-version:
    if: inputs.action == 'bump-and-release'
    uses: ./.github/workflows/bump_ios_version.yml
    with:
      current_version_code: ${{ inputs.version_code }}
    secrets: inherit

  release-after-bump:
    needs: bump-version
    if: inputs.action == 'bump-and-release'
    uses: ./.github/workflows/ios_build_manual.yml
    with:
      version_code: ${{ needs.bump-version.outputs.new_version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit
