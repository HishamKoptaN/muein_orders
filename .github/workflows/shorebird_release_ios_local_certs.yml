name: Shorebird Release iOS (Local Certs)
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "testflight"
  workflow_dispatch:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: "testflight"

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-macos
          restore-keys: flutter-deps-

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/.symlinks
            ~/Library/Developer/Xcode/DerivedData
          key: ios-deps-${{ hashFiles('ios/Podfile.lock') }}-macos
          restore-keys: ios-deps-macos-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-macos-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-macos-

      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/build
          key: ios-build-${{ github.sha }}-${{ inputs.version_code }}-macos
          restore-keys: ios-build-macos-

      - run: flutter pub get

      - run: |
          cd ios
          pod install --repo-update

      - name: 🔧 Install Certificate & Provisioning Profile (from local files)
        run: |
          echo "🔧 Installing iOS Certificate & Provisioning Profile from scripts/ios_certs/..."

          CERTS_DIR="${{ github.workspace }}/scripts/ios_certs"

          # التحقق من وجود الملفات
          echo "📁 Checking certificates directory: $CERTS_DIR"
          ls -la "$CERTS_DIR" || echo "❌ Directory not found!"

          # Create keychain
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="temp123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

          # Install Certificate (p12 file)
          if [ -f "$CERTS_DIR/certificate.p12" ]; then
            echo "📜 Installing certificate.p12..."
            P12_PASSWORD="${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }}"
            security import "$CERTS_DIR/certificate.p12" -k "$KEYCHAIN_NAME" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security || true
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
            echo "✅ Certificate installed"
          elif [ -f "$CERTS_DIR/distribution.pem" ] && [ -f "$CERTS_DIR/private_key" ]; then
            echo "📜 Creating and installing certificate from pem + key..."
            # إنشاء p12 من pem + key
            openssl pkcs12 -export -out /tmp/certificate.p12 -inkey "$CERTS_DIR/private_key" -in "$CERTS_DIR/distribution.pem" -password pass:"$KEYCHAIN_PASSWORD"
            security import /tmp/certificate.p12 -k "$KEYCHAIN_NAME" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security || true
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
            echo "✅ Certificate installed from pem+key"
          else
            echo "❌ No certificate found! Looking for:"
            ls -la "$CERTS_DIR/" || echo "Cannot list directory"
            exit 1
          fi

          # Install Provisioning Profile
          if [ -f "$CERTS_DIR/Muein_Orders_ios_app_store_1775392698.mobileprovision" ]; then
            echo "📋 Installing provisioning profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$CERTS_DIR/Muein_Orders_ios_app_store_1775392698.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/build_profile.mobileprovision
            echo "✅ Provisioning profile installed"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

            # Extract UUID from provisioning profile and set as env var
            PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/build_profile.mobileprovision)")
            echo "📋 Provisioning Profile UUID: $PP_UUID"
            echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          else
            echo "❌ Provisioning profile not found!"
            exit 1
          fi

      - name: 🔐 Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'G2L6LRG5PK' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "🔐 إعداد App Store Connect API Key..."

          # التحقق من وجود الملف أو Secret
          CERTS_DIR="${{ github.workspace }}/scripts/ios_certs"

          if [ -f "$CERTS_DIR/AuthKey_G2L6LRG5PK.p8" ]; then
            echo "📜 Using local API Key file..."
            mkdir -p ~/private_keys
            cp "$CERTS_DIR/AuthKey_G2L6LRG5PK.p8" ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          elif [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" ]; then
            echo "📜 Using API Key from Secret..."
            mkdir -p ~/private_keys
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          else
            echo "❌ No App Store Connect API Key found!"
            echo "Add either:"
            echo "  - scripts/ios_certs/AuthKey_G2L6LRG5PK.p8 (local file)"
            echo "  - APP_STORE_CONNECT_API_KEY_BASE64 (GitHub Secret)"
            exit 1
          fi

          # التحقق من Issuer ID
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "❌ APP_STORE_CONNECT_ISSUER_ID is required!"
            echo "Add it as a GitHub Secret."
            exit 1
          fi

          # تعيين متغيرات البيئة
          echo "APP_STORE_CONNECT_API_KEY_PATH=$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_KEY_ID=${APP_STORE_CONNECT_KEY_ID}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID=${APP_STORE_CONNECT_ISSUER_ID}" >> $GITHUB_ENV
          echo "✅ تم إعداد App Store Connect API Key"

      - name: 📦 Build Shorebird Release iOS
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PROVISIONING_PROFILE_UUID: ${{ env.PROVISIONING_PROFILE_UUID }}
        run: |
          echo "📦 إنشاء Shorebird Release iOS..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   استخدام Manual Code Signing..."
          echo "   Provisioning Profile UUID: $PROVISIONING_PROFILE_UUID"

          # استبدال الـ UUID في ExportOptions.plist
          sed -i '' "s/\$(PROVISIONING_PROFILE_UUID)/$PROVISIONING_PROFILE_UUID/g" ios/ExportOptions.plist
          echo "✅ تم تحديث ExportOptions.plist بالـ UUID"

          shorebird release ios \
            --flutter-version=3.41.2 \
            --dart-define=ENV=prod \
            --flavor=prod \
            --export-options-plist=ios/ExportOptions.plist

      - name: 📤 Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_KEY_ID: ${{ env.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ env.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "📤 رفع إلى App Store Connect..."
          echo "   القناة: $TRACK"

          # استخدام نفس ملف الـ API Key
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

          echo "✅ تم إنشاء الإصدار ورفعه بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   القناة: $TRACK"

