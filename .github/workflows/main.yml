name: Build and Distribute (v7a Optimized)

on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    # شرط التنفيذ: يجب أن تحتوي رسالة الـ Commit على كلمة build
    if: contains(github.event.head_commit.message, 'build')
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد الجافا مع تفعيل الكاش التلقائي لـ Gradle
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # 3. إعداد فلاتر مع تفعيل الكاش للـ SDK والـ Pub
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0" # أحدث نسخة مع Dart 3.10+
          channel: stable
          cache: true

      # 4. تحميل المكتبات (Dependencies)
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء التطبيق لمعمارية v7a فقط (أسرع بـ 3 مرات من البناء الكامل)
      # ملاحظة: --target-platform android-arm هي المعادل لـ armeabi-v7a
      - name: Build v7a APK
        run: flutter build apk --release --target-platform android-arm --no-tree-shake-icons

      # 6. توزيع الملف إلى Firebase App Distribution
      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: "testers" # تأكد من إنشاء هذه المجموعة في كونسول Firebase
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build: armeabi-v7a
            Message: ${{ github.event.head_commit.message }}
            Date: ${{ github.event.head_commit.author.date }}
