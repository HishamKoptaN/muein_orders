name: Test iOS Signing and Dry-Run Upload

on:
  push:
    branches:
      - prod

jobs:
  test-shorebird:
    runs-on: macos-14
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-filepath: ios/certificate.p12  
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain: signing_temp
          create-keychain: true  
      - run: |
          PP_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_PATH"
          if [ -f "ios/muein_prod.mobileprovision" ]; then
            cp ios/muein_prod.mobileprovision "$PP_PATH/"
            echo "Provisioning profile copied successfully."
          else
            echo "Error: Provisioning profile not found in ios/"
            exit 1
          fi   
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - run: |
          flutter pub get
          cd ios
          pod install
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - id: dry_run
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          if shorebird patch ios --flavor="${{ github.ref_name }}" --release-version=latest --dry-run; then
            echo "dry_run_status=success"
          else
            echo "dry_run_status=failed"
          fi
        continue-on-error: true