name: Test iOS Profile & Certificate Generation

on:
  workflow_dispatch: # يتيح لك تشغيل هذا الاختبار يدوياً من صفحة Actions على GitHub

jobs:
  test-profile:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Dotnet (Required for AppleDev tools if used)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Fix App Store Connect API Key Format
        shell: bash
        run: |
          echo "=== تجهيز وتصحيح مفتاح الـ API بصيغة متوافقة مع OpenSSL الحديث ==="
          echo "API_KEY_FIXED<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and Download Provisioning Profile via API
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: 'com.muein.orders'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ env.API_KEY_FIXED }}

      - name: Verify Provisioning Profile Installation
        shell: bash
        run: |
          echo "=== التحقق من وجود ملفات الـ Provisioning Profiles في نظام الماك ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "تم فحص وإنشاء البروفايل بنجاح تام دون أخطاء!"