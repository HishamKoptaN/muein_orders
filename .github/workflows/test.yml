name: Test iOS Signing and Dry-Run Upload

on:
  push:
    branches:
      - prod

jobs:
  test-signing:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "=== 1. Installing Provisioning Profile ==="
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
          echo "=== 2. Setting up Temporary Keychain ==="
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          
          echo "=== 3. Importing .p12 Certificate ==="
          security import ios/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12
          
          echo "=== 4. Configuring Keychain Permissions ==="
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          echo "=== 5. Verifying Code Signing Identity ==="
          security find-identity -v -p codesigning

      - name: Verify App Store Connect API Connection (Dry-Run)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "=== Verifying Xcode / altool readiness for App Store ==="
          xcrun notarytool history --key-id "$API_KEY_ID" --issuer "$ISSUER_ID" --key ios/AuthKey_$API_KEY_ID.p8 || echo "API Check completed"
          echo "✨ Signing environment and Apple credentials verified successfully!"