name: Test iOS Signing and Dry-Run Upload
on:
  push:
    branches:
      - prod
jobs:
  test-shorebird:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          sed -i 's|^storeFile=.*|storeFile=${{ github.ref_name }}/keyStore.jks|' android/key.properties
          cat android/key.properties