name: get-version

on:
  push:
    branches:
      - prod

jobs:
  get-version:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.shorebird_token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true  
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true 
      - shell: bash
        run: |
          TARGET_ID="6bb908ca-da56-44da-ac93-6232282ada05"
          PLATFORM="ios"
          if [ "$RUNNER_OS" == "macOS" ]; then
            sed -i '' "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          else
            sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          fi
          #==== جلب بيانات الإصدارات والبيئة الحالية ====
          raw_list_platform=$(shorebird releases list --platform=$PLATFORM 2>/dev/null || true)
          echo "raw_list_platform: $raw_list_platform"
          raw_list_all=$(shorebird releases list 2>/dev/null || true)
          build_numbers=$(echo "$raw_list_all" | grep -oE '\+[0-9]+' | tr -d '+' || true)
          
          # ==========================================
          # 3. تحديد اسم الإصدار الأساسي (Build Name)
          # ==========================================
          latest_full_version=$(echo "$raw_list_platform" | grep "$PLATFORM" | head -n 1 || true)
          version_field=$(echo "$latest_full_version" | awk '{print $2}')
          raw_base=$(echo "$version_field" | cut -d'+' -f1)
          BUILD_NAME=$(echo "$raw_base" | cut -d'-' -f1)
          latest_platform_build=$(echo "$version_field" | grep -oE '\+[0-9]+' | tr -d '+')
          current_flutter_version=$(flutter --version | head -n 1 | awk '{print $2}')

          # ==========================================
          # 4. خوارزمية البحث عن رقم بناء صالح (Smart Loop)
          # ==========================================  

          candidate_number=$((latest_platform_build + 1))
          while true; do
            existing_release=$(echo "$raw_list_all" | grep "+$candidate_number" || true)
            if [ -z "$existing_release" ]; then
              BUILD_NUMBER=$candidate_number
              break
            else
              existing_flutter_version=$(echo "$existing_release" | awk '{print $NF}')
              if [ "$current_flutter_version" == "$existing_flutter_version" ]; then
                BUILD_NUMBER=$candidate_number
                break
              else
                candidate_number=$((candidate_number + 1))
              fi  
          done
          echo "Calculated Build Name: $BUILD_NAME"
          echo "Calculated Build Number: $BUILD_NUMBER"
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT