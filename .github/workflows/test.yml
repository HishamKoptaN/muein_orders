name: Test - Check Version on Play Store

on:
  workflow_dispatch:
  push:
    branches:
      - prod
jobs:
  test-version-check:
    uses: ./.github/workflows/check_version_on_playstore.yml
    secrets: inherit

  report-result:
    runs-on: ubuntu-latest
    needs: test-version-check
    steps:
      - name: Report Check Result
        run: |
          echo "📊 نتيجة التحقق من الإصدار:"
          echo "   versionCode: ${{ needs.test-version-check.outputs.version_code }}"
          echo "   versionName: ${{ needs.test-version-check.outputs.version_name }}"
          echo "   exists on Play Store: ${{ needs.test-version-check.outputs.version_exists }}"

          if [ "${{ needs.test-version-check.outputs.version_exists }}" == "true" ]; then
            echo "⚠️  الإصدار موجود بالفعل على Google Play!"
          else
            echo "✅ الإصدار غير موجود - يمكن الرفع"
          fi
