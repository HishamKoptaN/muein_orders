name: Test Automatic Provisioning Profile Generation

on:
  workflow_dispatch:

jobs:
  generate-profile:
    runs-on: macos-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. تصحيح تنسيق مفتاح الـ API لضمان عدم حدوث خطأ DECODER في OpenSSL
      - name: Prepare App Store Connect API Key
        shell: bash
        run: |
          echo "API_KEY_FIXED<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 2. إنشاء وتثبيت شهادة التوزيع (Apple Distribution Certificate) تلقائياً
      - name: Setup Apple Certificate
        uses: kebechet/setup-apple-certificate@v1
        id: cert
        with:
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ env.API_KEY_FIXED }}
          distribution-private-key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}
          bundle-identifier: 'com.muein.orders'

      # 3. إنشاء وتثبيت الـ Provisioning Profile أوتوماتيكياً وتربيطه بالشهادة
      - name: Generate & Install Provisioning Profile
        uses: maui-actions/apple-provisioning@v4
        with:
          certificate: ${{ steps.cert.outputs.p12-certificate-base64 }}
          certificate-passphrase: ${{ steps.cert.outputs.p12-password }}
          bundle-identifiers: 'com.muein.orders'
          profile-types: IOS_APP_STORE
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ env.API_KEY_FIXED }}

      # 4. تأكيد النجاح والتحقق من التثبيت داخل نظام ماك
      - name: Verify Provisioning Profile
        shell: bash
        run: |
          echo "=== 1. الشهادات المثبتة في الـ Keychain ==="
          security find-identity -v -p codesigning
          
          echo "=== 2. ملفات الـ Provisioning Profiles المتولدة ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          
          echo "تم إنشاء وتثبيت البروفايل بنجاح أوتوماتيكي كامل!"
