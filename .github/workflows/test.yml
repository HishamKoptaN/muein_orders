name: Auto-Create & Download Provisioning Profile

on:
  push:
    branches: [ prod ]

jobs:
  generate-profile:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    steps:

      - uses: actions/checkout@v4
      - shell: bash
        run: |
          KEY_PATH="ios/api_private_key.p8"
          if [ ! -f "$KEY_PATH" ]; then
            echo "Error: Private key file not found at $KEY_PATH"
            exit 1
          fi
          
          # تحويل المفتاح الخام لصيغة PKCS#8 المتوافقة مع OpenSSL
          openssl pkcs8 -topk8 -nocrypt -in "$KEY_PATH" -out AuthKey_pkcs8.p8
          
          {
            echo "API_PRIVATE_KEY_FIXED<<EOF"
            cat AuthKey_pkcs8.p8
            echo "EOF"
          } >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: maui-actions/apple-provisioning@v4
        with:
          bundle-identifiers: 'com.muein.orders'
          profile-types: IOS_APP_STORE
          app-store-connect-key-id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          app-store-connect-issuer-id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: 'ios/api_private_key.p8'

      - shell: bash
        run: |
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "تم فحص وإنشاء البروفايل أوتوماتيكياً بنجاح تام!"
