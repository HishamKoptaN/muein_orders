name: Test iOS Signing and Dry-Run Upload

on:
  push:
    branches:
      - prod
jobs:
  test-shorebird:
    runs-on: macos-14
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-filepath: ios/certificate.p12  
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain: signing_temp
          create-keychain: true  
      - run: |
          PP_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_PATH"
          if [ -f "ios/muein_prod.mobileprovision" ]; then
            cp ios/muein_prod.mobileprovision "$PP_PATH/"
            echo "Provisioning profile copied successfully."
          else
            echo "Error: Provisioning profile not found in ios/"
            exit 1
          fi   
      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ios-pods-${{ hashFiles('ios/Podfile.lock') }}-${{ runner.os }}
          restore-keys: |
            ios-pods-
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/swift-package-manager
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-pods-swift-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${- runner.os }}-pods-swift-   
      - uses: actions/cache@v4
        with:
          path: |
            build/
            .dart_tool/
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-${{ hashFiles('pubspec.lock') }}-
            ${{ runner.os }}-flutter-build-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/Pods
            ios/.symlinks
          key: ios-patch-${{ github.sha }}-macos
          restore-keys: ios-patch-macos-
      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update
      - id: dry_run
        env:
          SHOREBIRD_TOKEN: ${{ secrets.shorebird_token }}
        shell: bash
        run: |
         if shorebird patch ios --flavor="${{ github.ref_name }}" --dry-run; then
            echo "dry_run_status=success"
          else
            echo "dry_run_status=failed"
          fi
        continue-on-error: true