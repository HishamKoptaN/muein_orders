name: Fully Automated Certificate & Profile Generation

on:
  workflow_dispatch:
  push:
    branches: [ prod ]

jobs:
  auto-generate-signing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. كتابة مفتاح App Store Connect API إلى ملف JSON
      - name: Create App Store Connect API Key file
        shell: bash
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # كتابة المفتاح الخاص كملف .p8
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          # إنشاء api_key.json لاستخدامه مع fastlane
          cat > api_key.json << EOF
          {
            "key_id": "${{ secrets.APP_STORE_CONNECT_KEY_ID }}",
            "issuer_id": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "key": "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}",
            "in_house": false
          }
          EOF

      # 2. توليد Keychain مؤقت لتخزين الشهادة
      - name: Create temporary Keychain
        shell: bash
        run: |
          security create-keychain -p "temp_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp_password" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

      # 3. توليد الشهادة تلقائياً عبر App Store Connect API (fastlane cert)
      #    يقوم بإنشاء مفتاح خاص + CSR + رفعه لـ Apple + تنزيل الشهادة
      - name: Auto-generate Distribution Certificate (fastlane cert)
        shell: bash
        run: |
          gem install fastlane --no-document
          fastlane run get_certificates \
            api_key_path:"api_key.json" \
            keychain_path:"build.keychain" \
            keychain_password:"temp_password" \
            output_path:"./certs" \
            generate_apple_certs:true

      # 4. توليد Provisioning Profile تلقائياً عبر App Store Connect API (fastlane sigh)
      - name: Auto-generate Provisioning Profile (fastlane sigh)
        shell: bash
        run: |
          fastlane run get_provisioning_profile \
            api_key_path:"api_key.json" \
            app_identifier:"com.muein.orders" \
            provisioning_name:"muein_orders_AppStore" \
            output_path:"./profiles" \
            force:true

      # 5. تثبيت الـ Provisioning Profile
      - name: Install Provisioning Profile
        shell: bash
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ./profiles/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # 6. التحقق من نجاح التثبيت
      - name: Verify signing setup
        shell: bash
        run: |
          echo "=== الشهادات في الـ Keychain ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "تم توليد الشهادة والبروفايل بالكامل تلقائياً بنجاح!"
