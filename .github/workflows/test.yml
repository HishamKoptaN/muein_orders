name: Generate Provisioning Profile Only

on:
    push:
        branches: [ prod ]
jobs:
  generate-profile:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Generate and Download Provisioning Profile
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: 'com.muein.orders'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

      - name: Verify Profile Exists
        shell: bash
        run: |
          echo "=== التحقق من البروفايل الذي تم إنشاؤه ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "تم إنشاء البروفايل بنجاح!"