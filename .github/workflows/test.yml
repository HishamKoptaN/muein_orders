name: Test iOS Profile & Certificate 

on:
    push:
        branches: [ prod ]
    workflow_dispatch:
jobs:
  test-profile:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - shell: bash
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > raw_key.p8
          openssl pkcs8 -in raw_key.p8 -topk8 -nocrypt -outform PEM 2>/dev/null > fixed_key.p8 || openssl pkey -in raw_key.p8 -outform PEM 2>/dev/null > fixed_key.p8 || cp raw_key.p8 fixed_key.p8
          if [ ! -s fixed_key.p8 ]; then
            cp raw_key.p8 fixed_key.p8
          fi
          {
            echo 'API_KEY_FIXED<<EOF'
            cat fixed_key.p8
            echo 'EOF'
          } >> $GITHUB_ENV
          echo "Fixed key length: ${#API_KEY_FIXED}"

      - uses: apple-actions/download-provisioning-profiles@v1
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        with:
          bundle-id: 'com.muein.orders'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ env.API_KEY_FIXED }}
      - shell: bash
        run: |
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "تم فحص وإنشاء البروفايل بنجاح تام دون أخطاء!"