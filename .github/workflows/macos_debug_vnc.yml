name: macOS Debug with VNC

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

jobs:
  build-and-debug:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup macOS VNC Server
        run: |
          echo "🖥️ Setting up macOS Screen Sharing..."

          VNC_PASS="debug123"

          # Method 1: Enable Remote Management with kickstart
          echo "🔧 Enabling Remote Management..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -privs -all \
            -allowAccessFor -allUsers \
            -restart -agent

          # Method 2: Set VNC password using system preferences
          echo "🔑 Setting VNC password..."
          # Create the hash using Perl (same as macOS uses internally)
          sudo perl -e '
            my $pwd = "'"$VNC_PASS"'";
            my @key = (23, 82, 107, 6, 35, 78, 88, 7);
            my $hash = "";
            for (my $i = 0; $i < 8; $i++) {
              my $c = substr($pwd, $i, 1);
              $c = "\0" if $c eq "";
              $hash .= chr(ord($c) ^ $key[$i]);
            }
            print $hash;
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null

          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt

          # Method 3: Enable Screen Sharing
          echo "📺 Enabling Screen Sharing..."
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ScreenSharingEnabled -bool true

          # Method 4: Restart services
          echo "� Restarting services..."
          sudo killall screensharingd 2>/dev/null || true
          sleep 2

          # Try to start screensharing daemon
          sudo launchctl load /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 3

          # Check status
          echo "🔍 Checking VNC status..."
          if pgrep -x "screensharingd" > /dev/null; then
            echo "✅ screensharingd is running"
          else
            echo "⚠️ screensharingd not found, checking alternatives..."
            pgrep -f "screensharing" || true
          fi

          # Check port
          echo "� Checking port 5900..."
          sudo lsof -i :5900 2>/dev/null || echo "Port 5900 not listening yet"

          echo ""
          echo "✅ VNC Configuration Complete!"
          echo "🔑 Password: $VNC_PASS"
          echo "🔌 Port: 5900"
          echo "⚠️ Note: VNC may not work in headless environment"
          echo "📸 Screenshots will still be captured as backup"

      - name: Install Tailscale
        run: |
          echo "🔧 Installing Tailscale..."
          brew install tailscale

          echo "🚀 Starting Tailscale..."
          sudo tailscaled &
          sleep 3

          echo "📡 Getting Tailscale auth URL..."
          TAILSCALE_URL=$(sudo tailscale up --auth-key ${{ secrets.TAILSCALE_AUTHKEY }} --hostname github-macos-debug 2>&1 | grep -o 'https://login.tailscale.com/[^"]*' || echo "")

          if [ -n "$TAILSCALE_URL" ]; then
            echo "🔗 Tailscale Auth URL: $TAILSCALE_URL"
            echo "   Open this URL to authenticate this machine"
          fi

          sleep 10

          # Get Tailscale IP
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || echo "")
          if [ -n "$TAILSCALE_IP" ]; then
            echo "🌐 Tailscale IP: $TAILSCALE_IP"
            echo ""
            echo "🖥️ VNC Connection Info:"
            echo "   Server: $TAILSCALE_IP:5900"
            echo "   Password: debug123"
          fi

          echo "⏳ Waiting 10 minutes for Tailscale connection..."
          sleep 600
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        timeout-minutes: 15

      - name: System Info
        run: |
          echo "🍎 macOS Version:"
          sw_vers
          echo ""
          echo "🛠️ Xcode Version:"
          xcodebuild -version
          echo ""
          echo "📱 Available Simulators:"
          xcrun simctl list devices available | head -20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Setup Screenshot Capture
        run: |
          echo "📸 Setting up automated screenshots..."
          mkdir -p screenshots
          capture_screen() {
            local name=$1
            echo "📸 Capturing: $name"
            xcrun simctl io booted screenshot screenshots/"${name}_$(date +%H%M%S).png" 2>/dev/null || true
          }
          (
            while true; do
              capture_screen "auto"
              sleep 30
            done
          ) &
          echo "✅ Screenshot capture started"

      - run: |
          # List available simulators
          xcrun simctl list devices available

          # Start iPhone 16 Pro simulator (أول جهاز متاح)
          echo "🔍 Searching for iPhone simulator..."
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro.*\([A-F0-9-]{36}\)" | grep -v "iPhone.*Pro.*Max" | head -1 | grep -oE '[A-F0-9-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone Pro not found, trying iPhone 16..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone 16 not found, trying any iPhone..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          echo "📱 Starting simulator with ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"

          echo "✅ Simulator started (headless mode)"
          echo "⏳ Waiting 30 seconds for simulator to initialize..."
          sleep 30

      - name: Build iOS App
        run: |
          echo "🔨 Building iOS app..."
          flutter build ios --${{ env.BUILD_TYPE }} --no-codesign

      - name: Install on Simulator
        run: |
          echo "📱 Installing app on simulator..."
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          echo "✅ App installed! You can now open it in the simulator"

          # Keep app running for screenshots
          echo "⏳ App running - capturing screenshots for 2 minutes..."
          sleep 120

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          retention-days: 5

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          xcrun simctl shutdown all || true
