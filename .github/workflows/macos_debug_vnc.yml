name: macOS Debug with VNC

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

jobs:
  build-and-debug:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "🍎 macOS Version:"
          sw_vers
          echo ""
          echo "🛠️ Xcode Version:"
          xcodebuild -version
          echo ""
          echo "📱 Available Simulators:"
          xcrun simctl list devices available | head -20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Setup ngrok tunnel
        run: |
          echo "🔧 Installing ngrok..."
          brew install ngrok

          echo "🔑 Setting up ngrok authtoken..."
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

          echo "🚀 Starting ngrok SSH tunnel..."
          ngrok tcp 22 --log=stdout &
          sleep 10

          echo "📡 Getting ngrok public URL..."
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*"' | head -1 | cut -d'"' -f4)
          echo "🔗 SSH Connection URL: $NGROK_URL"
          echo ""
          echo "📝 Connect using:"
          echo "   ssh runner@$(echo $NGROK_URL | cut -d: -f2 | sed 's|//||') -p $(echo $NGROK_URL | cut -d: -f3)"
          echo ""
          echo "⏳ Waiting 5 minutes for connection..."
          sleep 300
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        timeout-minutes: 10

      - name: Setup Screenshot Capture
        run: |
          echo "📸 Setting up automated screenshots..."
          # Create screenshot directory
          mkdir -p screenshots

          # Function to capture screenshot (Simulator only - no GUI permissions needed)
          capture_screen() {
            local name=$1
            echo "📸 Capturing: $name"
            # Use Simulator screenshot only (works without macOS GUI permissions)
            xcrun simctl io booted screenshot screenshots/"${name}_$(date +%H%M%S).png" 2>/dev/null || true
          }

          # Start background screenshot capture every 30 seconds
          (
            while true; do
              capture_screen "auto"
              sleep 30
            done
          ) &

          echo "✅ Screenshot capture started (every 30 seconds)"
          echo "📁 Screenshots will be uploaded as artifacts"

      - name: Setup VNC Server
        run: |
          echo "🖥️ Setting up VNC server..."
          # Create password for VNC (password: vncpass)
          echo 'vncpass' | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8F5E92DE9E5C4B76D3E9D"; } s/(.)/chr(ord($^) ^ $k[$i++%@k])/ge for <>; print pack "H*", $_' | tee /tmp/vncpass.bin
          sudo mkdir -p /Library/Preferences/com.apple.RemoteDesktop
          sudo defaults write /Library/Preferences/com.apple.RemoteDesktop VNCAlwaysStartOnConsole -bool true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all
          # Alternative: Use built-in Screen Sharing
          sudo defaults write /var/db/dslocal/nodes/Default/users/runner.plist UserShell /bin/bash
          echo "✅ VNC enabled - Connect via SSH tunnel"

      - run: |
          echo "🖥️  Connection Info:"
          echo ""
          echo "SSH: Copy the tmate session link above"
          echo ""
          echo "VNC (via SSH tunnel):"
          echo "  1. Connect SSH: ssh xxx@nyc1.tmate.io"
          echo "  2. In another terminal, create tunnel:"
          echo "     ssh -L 5900:localhost:5900 xxx@nyc1.tmate.io -N"
          echo "  3. Open VNC client: vnc://localhost:5900"
          echo "     Password: vncpass"
          echo ""
          echo "⏳ Build will continue in background..."
          echo "⏳ You have 60 minutes to connect and debug"

      - run: |
          # List available simulators
          xcrun simctl list devices available

          # Start iPhone 16 Pro simulator (أول جهاز متاح)
          echo "🔍 Searching for iPhone simulator..."
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro.*\([A-F0-9-]{36}\)" | grep -v "iPhone.*Pro.*Max" | head -1 | grep -oE '[A-F0-9-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone Pro not found, trying iPhone 16..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone 16 not found, trying any iPhone..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          echo "📱 Starting simulator with ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"

          # Open simulator app
          open -a Simulator

          echo "✅ Simulator started"
          echo "⏳ Waiting for VNC connection (sleeping 5 minutes)..."
          echo "   Connect now to see the simulator"
          sleep 300

      - name: Build iOS App
        run: |
          echo "🔨 Building iOS app..."
          flutter build ios --${{ env.BUILD_TYPE }} --no-codesign

      - name: Install on Simulator
        run: |
          echo "📱 Installing app on simulator..."
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          echo "✅ App installed! You can now open it in the simulator"

          # Keep session alive for testing
          echo "⏳ Session will stay alive for 30 more minutes..."
          sleep 1800

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          retention-days: 5

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          xcrun simctl shutdown all || true
