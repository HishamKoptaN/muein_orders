name: macOS Debug with VNC

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

jobs:
  build-and-debug:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "🍎 macOS Version:"
          sw_vers
          echo ""
          echo "🛠️ Xcode Version:"
          xcodebuild -version
          echo ""
          echo "📱 Available Simulators:"
          xcrun simctl list devices available | head -20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Setup x11vnc Server
        run: |
          echo "🖥️ Installing x11vnc server..."

          # Install x11vnc (actual VNC server for macOS)
          brew install x11vnc

          VNC_PASS="debug123"

          # Create VNC password file manually (x11vnc compatible format)
          # VNC password uses DES encryption
          mkdir -p ~/.vnc

          # Generate VNC password hash using x11vnc-compatible method
          # Password must be padded to 8 characters, then encrypted
          python3 << 'EOF'
          import struct
          import os

          passwd = "debug123".ljust(8)[:8]

          # VNC uses a simple XOR encryption with fixed key
          key = bytes([23, 82, 107, 6, 35, 78, 88, 7])

          result = bytearray(16)
          for i, c in enumerate(passwd.encode('latin-1')):
              result[i] = c ^ key[i]

          passwd_path = os.path.expanduser("~/.vnc/passwd")
          with open(passwd_path, 'wb') as f:
              f.write(result)
          os.chmod(passwd_path, 0o600)
          print("Password file created successfully")
          EOF

          # Start x11vnc server on port 5900
          # -display :0 connects to main display
          # -forever keeps it running
          # -shared allows multiple connections
          # -localhost no allows external connections
          echo "🚀 Starting x11vnc server..."
          x11vnc -display :0 -rfbport 5900 -rfbauth ~/.vnc/passwd -forever -shared -localhost no -noxdamage -noxkb &
          sleep 5

          # Check if server is running
          if pgrep -x "x11vnc" > /dev/null || lsof -i :5900 > /dev/null 2>&1; then
            echo "✅ x11vnc server is running on port 5900"
          else
            echo "⚠️ Checking process status..."
            pgrep -f "vnc" || echo "No VNC processes found"
            ps aux | grep -i vnc | grep -v grep || true
          fi

          # Verify port
          echo "🔍 Checking port 5900..."
          lsof -i :5900 2>/dev/null || netstat -an 2>/dev/null | grep 5900 || echo "Port check skipped"

          echo ""
          echo "✅ VNC Server Ready!"
          echo "🔑 Password: $VNC_PASS"
          echo "🔌 Port: 5900"
          echo ""
          echo "⚠️ Connect via: 100.x.x.x:5900"

      - name: Install Tailscale
        run: |
          echo "🔧 Installing Tailscale..."
          brew install tailscale

          echo "🚀 Starting Tailscale..."
          sudo tailscaled &
          sleep 3

          echo "📡 Getting Tailscale auth URL..."
          TAILSCALE_URL=$(sudo tailscale up --auth-key ${{ secrets.TAILSCALE_AUTHKEY }} --hostname github-macos-debug 2>&1 | grep -o 'https://login.tailscale.com/[^"]*' || echo "")

          if [ -n "$TAILSCALE_URL" ]; then
            echo "🔗 Tailscale Auth URL: $TAILSCALE_URL"
            echo "   Open this URL to authenticate this machine"
          fi

          sleep 10

          # Get Tailscale IP
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || echo "")
          if [ -n "$TAILSCALE_IP" ]; then
            echo "🌐 Tailscale IP: $TAILSCALE_IP"
            echo ""
            echo "🖥️ VNC Connection Info:"
            echo "   Server: $TAILSCALE_IP:5900"
            echo "   Password: debug123"
          fi

          echo "⏳ Waiting 10 minutes for Tailscale connection..."
          sleep 600
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        timeout-minutes: 15

      - name: Setup Screenshot Capture
        run: |
          echo "📸 Setting up automated screenshots..."
          mkdir -p screenshots
          capture_screen() {
            local name=$1
            echo "📸 Capturing: $name"
            xcrun simctl io booted screenshot screenshots/"${name}_$(date +%H%M%S).png" 2>/dev/null || true
          }
          (
            while true; do
              capture_screen "auto"
              sleep 30
            done
          ) &
          echo "✅ Screenshot capture started"

      - run: |
          # List available simulators
          xcrun simctl list devices available

          # Start iPhone 16 Pro simulator (أول جهاز متاح)
          echo "🔍 Searching for iPhone simulator..."
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro.*\([A-F0-9-]{36}\)" | grep -v "iPhone.*Pro.*Max" | head -1 | grep -oE '[A-F0-9-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone Pro not found, trying iPhone 16..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone 16 not found, trying any iPhone..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          echo "📱 Starting simulator with ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"

          echo "✅ Simulator started (headless mode)"
          echo "⏳ Waiting 30 seconds for simulator to initialize..."
          sleep 30

      - name: Build iOS App
        run: |
          echo "🔨 Building iOS app..."
          flutter build ios --${{ env.BUILD_TYPE }} --no-codesign

      - name: Install on Simulator
        run: |
          echo "📱 Installing app on simulator..."
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          echo "✅ App installed! You can now open it in the simulator"

          # Keep app running for screenshots
          echo "⏳ App running - capturing screenshots for 2 minutes..."
          sleep 120

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          retention-days: 5

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          xcrun simctl shutdown all || true
