name: macOS Debug with VNC

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-and-debug:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Start tmate session (VNC/SSH Access)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Show connection info
        run: |
          echo "🖥️  VNC Connection Info:"
          echo "Open the tmate session above to get SSH link"
          echo "Then run: open vnc://localhost:5900"
          echo ""
          echo "⏳ Build will continue in background..."
          echo "⏳ You have 60 minutes to connect and debug"

      - name: Start iOS Simulator
        run: |
          # List available simulators
          xcrun simctl list devices available

          # Start iPhone 15 Pro simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Starting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"

          # Open simulator app
          open -a Simulator

          echo "✅ Simulator started"
          echo "⏳ Waiting for VNC connection (sleeping 5 minutes)..."
          echo "   Connect now to see the simulator"
          sleep 300

      - name: Build iOS App
        run: |
          echo "🔨 Building iOS app..."
          flutter build ios --${{ github.event.inputs.build_type }} --no-codesign

      - name: Install on Simulator
        run: |
          echo "📱 Installing app on simulator..."
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          echo "✅ App installed! You can now open it in the simulator"

          # Keep session alive for testing
          echo "⏳ Session will stay alive for 30 more minutes..."
          sleep 1800

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          xcrun simctl shutdown all || true
