name: macOS Screenshots Only

on:
  push:
    branches:
      - prods
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

jobs:
  # Job 1: Setup Environment
  setup:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      device_id: ${{ steps.simulator.outputs.device_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Start Simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro.*\([A-F0-9-]{36}\)" | grep -v "iPhone.*Pro.*Max" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          xcrun simctl boot "$DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT
          sleep 30

      - name: Setup Screenshots
        run: |
          mkdir -p screenshots
          capture_screen() {
            xcrun simctl io booted screenshot screenshots/"${1}_$(date +%H%M%S).png" 2>/dev/null || true
          }
          (while true; do capture_screen "auto"; sleep 30; done) &

  # Job 2: Build & Capture
  screenshots:
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install & Build
        run: |
          flutter pub get
          cd ios && pod install --repo-update
          flutter build ios --${{ env.BUILD_TYPE }} --no-codesign

      - name: Reboot & Install
        run: |
          xcrun simctl shutdown all || true
          sleep 5
          xcrun simctl boot ${{ needs.setup.outputs.device_id }}
          sleep 30
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          xcrun simctl launch booted com.example.mueinOrders || true
          sleep 120

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 5

  # Job 3: Cleanup
  cleanup:
    runs-on: macos-latest
    needs: screenshots
    if: always()
    timeout-minutes: 5
    steps:
      - name: Cleanup
        run: xcrun simctl shutdown all || true
