name: Trigger Codemagic Build
on:
  push:
    branches: [prod]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "🚀 Triggering Codemagic build..."
          curl -X POST "https://api.codemagic.io/hooks/69e22d0468ccd4f8805e9a4b" \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/prod","appId":"6761682256"}'
          echo "✅ Codemagic build triggered"
