name: Windows Debug with Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

jobs:
  build-and-debug:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Chrome Remote Desktop
        run: |
          echo "🔧 Installing Chrome Remote Desktop..."
          # Download and install Chrome Remote Desktop
          $url = "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb"
          # For Windows, we need the Windows version
          # Chrome Remote Desktop for Windows is installed via MSI
          
          # Alternative: Use Windows built-in Remote Desktop (RDP)
          echo "🖥️ Setting up Windows RDP..."
          
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Create a user for RDP (if needed)
          $password = ConvertTo-SecureString "DebugPass123!" -AsPlainText -Force
          New-LocalUser -Name "debuguser" -Password $password -FullName "Debug User" -Description "For GitHub Actions debugging"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "debuguser"
          Add-LocalGroupMember -Group "Administrators" -Member "debuguser"
          
          # Get connection info
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org")
          echo "🌐 Public IP: $ip"
          echo "👤 Username: debuguser"
          echo "🔑 Password: DebugPass123!"
          echo ""
          echo "⚠️ Connect using Windows Remote Desktop:"
          echo "   mstsc /v:$ip"
          echo ""
          echo "⏳ Waiting 10 minutes for connection..."
          Start-Sleep -Seconds 600
        shell: powershell
        timeout-minutes: 15

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: |
          flutter pub get
          flutter build windows --${{ env.BUILD_TYPE }}

      - name: Setup Screenshot Capture
        run: |
          echo "📸 Setting up automated screenshots..."
          New-Item -ItemType Directory -Force -Path screenshots
          
          # Function to capture screenshot
          function Capture-Screen {
            param($name)
            echo "📸 Capturing: $name"
            Add-Type -AssemblyName System.Windows.Forms
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save("screenshots/${name}_$(Get-Date -Format HHmmss).png")
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          
          # Capture initial screenshot
          Capture-Screen "initial"
          
          # Background capture every 30 seconds
          Start-Job -ScriptBlock {
            while ($true) {
              Add-Type -AssemblyName System.Windows.Forms
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              $bitmap.Save("screenshots/auto_$(Get-Date -Format HHmmss).png")
              $graphics.Dispose()
              $bitmap.Dispose()
              Start-Sleep -Seconds 30
            }
          }
          
          echo "✅ Screenshot capture started"
        shell: powershell

      - name: Run App & Wait
        run: |
          echo "🚀 Running Windows app..."
          Start-Process build/windows/x64/runner/${{ env.BUILD_TYPE }}/muein_orders.exe
          echo "✅ App started"
          echo "⏳ Capturing screenshots for 5 minutes..."
          Start-Sleep -Seconds 300
        shell: powershell

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-screenshots
          path: screenshots/
          retention-days: 5
