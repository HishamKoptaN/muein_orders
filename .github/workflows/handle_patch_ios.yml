name: Handle Patch iOS

on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      has_native_changes:
        required: true
        type: string
      version_exists:
        required: true
        type: string
      track:
        required: false
        type: string
        default: "testflight"

jobs:
  # ─────────────────────────────────────────────────────────────
  # السيناريو 1: Patch عادي (لا يوجد Native + الإصدار موجود)
  # ─────────────────────────────────────────────────────────────
  patch:
    if: inputs.has_native_changes == 'false' && inputs.version_exists == 'true'
    uses: ./.github/workflows/shorebird_patch_ios.yml
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # السيناريو 2: Native موجود والإصدار موجود → Bump ثم Release
  # ─────────────────────────────────────────────────────────────
  bump-for-native:
    if: inputs.has_native_changes == 'true' && inputs.version_exists == 'true'
    uses: ./.github/workflows/bump_ios_version.yml
    with:
      current_version_code: ${{ inputs.version_code }}
    secrets: inherit

  release-after-bump:
    needs: bump-for-native
    if: inputs.has_native_changes == 'true' && inputs.version_exists == 'true'
    uses: ./.github/workflows/shorebird_release_ios.yml
    with:
      version_code: ${{ needs.bump-for-native.outputs.new_version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # السيناريو 3: Native موجود والإصدار غير موجود → Release جديد
  # ─────────────────────────────────────────────────────────────
  release-new:
    if: inputs.has_native_changes == 'true' && inputs.version_exists == 'false'
    uses: ./.github/workflows/shorebird_release_ios.yml
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # السيناريو 4: Native غير موجود والإصدار غير موجود → Release جديد
  # ─────────────────────────────────────────────────────────────
  release-first:
    if: inputs.has_native_changes == 'false' && inputs.version_exists == 'false'
    uses: ./.github/workflows/shorebird_release_ios.yml
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit
