name: Deploy to App Store
on:
  push:
    branches:
      - prods
  workflow_dispatch:
    inputs:
      track:
        description: "App Store track"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - appstore
      force_patch:
        description: "فرض استخدام Shorebird Patch"
        required: false
        default: false
        type: boolean
      force_release:
        description: "فرض إنشاء إصدار جديد"
        required: false
        default: false
        type: boolean

jobs:
  check-version:
    uses: ./.github/workflows/check_version_on_appstore.yml
    secrets: inherit

  check-native:
    uses: ./.github/workflows/check_native_changes_ios.yml

  decide-action:
    runs-on: ubuntu-latest
    needs: [check-version, check-native]
    outputs:
      action: ${{ steps.decide.outputs.action }}
      version_code: ${{ needs.check-version.outputs.version_code }}
      version_name: ${{ needs.check-version.outputs.version_name }}
      version_exists: ${{ needs.check-version.outputs.version_exists }}
    steps:
      - id: decide
        run: |
          VERSION_EXISTS="${{ needs.check-version.outputs.version_exists }}"
          HAS_NATIVE="${{ needs.check-native.outputs.has_native_changes }}"
          echo "   منصة: iOS (App Store)"
          FORCE_PATCH="${{ github.event.inputs.force_patch }}"
          FORCE_RELEASE="${{ github.event.inputs.force_release }}"

          echo "📊 تحليل الوضع:"
          echo "   الإصدار موجود: $VERSION_EXISTS"
          echo "   تغييرات Native: $HAS_NATIVE"
          echo "   force_patch: $FORCE_PATCH"
          echo "   force_release: $FORCE_RELEASE"

          if [ "$FORCE_PATCH" == "true" ]; then
            echo "🔧 Patch (فرض)"
            echo "action=patch" >> $GITHUB_OUTPUT
          elif [ "$FORCE_RELEASE" == "true" ]; then
            echo "📦 Release (فرض)"
            echo "action=release" >> $GITHUB_OUTPUT
          elif [ "$HAS_NATIVE" == "true" ] && [ "$VERSION_EXISTS" == "true" ]; then
            echo "⚠️ الإصدار موجود وتوجد تغييرات Native"
            echo "   سيتم زيادة versionCode تلقائياً..."
            echo "action=bump-and-release" >> $GITHUB_OUTPUT
          elif [ "$HAS_NATIVE" == "true" ]; then
            echo "📦 توجد تغييرات Native والإصدار غير موجود → Release جديد"
            echo "action=release" >> $GITHUB_OUTPUT
          elif [ "$VERSION_EXISTS" == "true" ]; then
            echo "🔧 الإصدار موجود ولا توجد تغييرات Native → Patch"
            echo "action=patch" >> $GITHUB_OUTPUT
          else
            echo "📦 الإصدار غير موجود ولا توجد تغييرات Native → Release جديد"
            echo "action=release" >> $GITHUB_OUTPUT
          fi

  handle-patch:
    needs: decide-action
    if: ${{ needs.decide-action.outputs.action == 'patch' }}
    uses: ./.github/workflows/handle_patch_ios.yml
    with:
      version_code: ${{ needs.decide-action.outputs.version_code }}
      version_name: ${{ needs.decide-action.outputs.version_name }}
      has_native_changes: ${{ needs.check-native.outputs.has_native_changes }}
      version_exists: ${{ needs.check-version.outputs.version_exists }}
      track: ${{ github.event.inputs.track || 'testflight' }}
    secrets: inherit

  handle-release:
    needs: decide-action
    if: ${{ needs.decide-action.outputs.action == 'release' || needs.decide-action.outputs.action == 'bump-and-release' }}
    uses: ./.github/workflows/handle_release_ios.yml
    with:
      action: ${{ needs.decide-action.outputs.action }}
      version_code: ${{ needs.decide-action.outputs.version_code }}
      version_name: ${{ needs.decide-action.outputs.version_name }}
      track: ${{ github.event.inputs.track || 'testflight' }}
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs:
      [check-version, check-native, decide-action, handle-patch, handle-release]
    if: always()
    steps:
      - run: |
          echo "📋 ملخص التوزيع (App Store):"
          echo "   الإصدار: ${{ needs.decide-action.outputs.version_code }} (${{ needs.decide-action.outputs.version_name }})"
          echo "   موجود على App Store: ${{ needs.decide-action.outputs.version_exists }}"
          echo "   تغييرات Native: ${{ needs.check-native.outputs.has_native_changes }}"
          echo "   العملية المُنفذة: ${{ needs.decide-action.outputs.action }}"
