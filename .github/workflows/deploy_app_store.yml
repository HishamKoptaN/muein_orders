name: Deploy to App Store (Multi-Method)
on:
  push:
    branches:
      - prods
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      method:
        description: "طريقة النشر"
        required: true
        default: "fastlane-match"
        type: choice
        options:
          - auto
          - fastlane-match
          - fastlane-legacy
          - shorebird
          - codemagic
          - manual
      track:
        description: "App Store track"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - appstore
      force_patch:
        description: "فرض استخدام Shorebird Patch"
        required: false
        default: false
        type: boolean
      force_release:
        description: "فرض إنشاء إصدار جديد"
        required: false
        default: false
        type: boolean

jobs:
  # Decision Logic
  decision:
    uses: ./.github/workflows/deploy_decision.yml
    with:
      method: ${{ github.event.inputs.method || 'auto' }}
      track: ${{ github.event.inputs.track || 'testflight' }}
      force_patch: ${{ github.event.inputs.force_patch }}
      force_release: ${{ github.event.inputs.force_release }}
    secrets: inherit

  deploy-shorebird:
    needs: [decision]
    # تشغيل إذا فشلت السابقتان أو كانت الطريقة محددة shorebird
    if: |
      always() && 
      (needs.decision.outputs.method == 'shorebird' || 
       (needs.decision.outputs.method == 'auto' && 
        needs.deploy-fastlane-match.result == 'failure' && 
        needs.deploy-fastlane-legacy.result == 'failure'))
    uses: ./.github/workflows/deploy_shorebird.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      action: ${{ needs.decision.outputs.action }}
      version_name: ${{ needs.decision.outputs.version_name }}
      version_code: ${{ needs.decision.outputs.version_code }}

  # Method 4: Codemagic (fallback)
  deploy-codemagic:
    needs: [decision, deploy-shorebird]
    # تشغيل إذا فشلت السابقات أو كانت الطريقة محددة codemagic
    if: |
      always() && 
      (needs.decision.outputs.method == 'codemagic' || 
       (needs.decision.outputs.method == 'auto' && 
        needs.deploy-fastlane-match.result == 'failure' && 
        needs.deploy-fastlane-legacy.result == 'failure' && 
        needs.deploy-shorebird.result == 'failure'))
    uses: ./.github/workflows/deploy_codemagic.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      build_mode: release

  # Method 5: Manual (fallback أخير)
  deploy-manual:
    needs:
      [
        decision,
        deploy-shorebird,
        deploy-codemagic,
      ]
    if: |
      always() && 
      (needs.decision.outputs.method == 'manual' || 
       (needs.decision.outputs.method == 'auto' && 
        needs.deploy-fastlane-match.result == 'failure' && 
        needs.deploy-fastlane-legacy.result == 'failure' && 
        needs.deploy-shorebird.result == 'failure' && 
        needs.deploy-codemagic.result == 'failure'))
    uses: ./.github/workflows/deploy_manual.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      action: ${{ needs.decision.outputs.action }}
      version_name: ${{ needs.decision.outputs.version_name }}
      version_code: ${{ needs.decision.outputs.version_code }}

  # Summary
  summary:
    runs-on: ubuntu-latest
    needs:
      [
        decision,
        deploy-shorebird,
        deploy-manual,
        deploy-codemagic,
      ]
    if: always()
    steps:
      - run: |
          echo "📋 ملخص التوزيع (App Store):"
          echo "   الإصدار: ${{ needs.decision.outputs.version_code }} (${{ needs.decision.outputs.version_name }})"
          echo "   موجود على App Store: ${{ needs.decision.outputs.version_exists }}"
          echo "   العملية المُنفذة: ${{ needs.decision.outputs.action }}"
          echo "   طريقة النشر: ${{ needs.decision.outputs.method }}"
          echo ""
          echo "🔄 حالة كل طريقة:"
          echo "   Shorebird: ${{ needs.deploy-shorebird.result || 'skipped' }}"
          echo "   Manual: ${{ needs.deploy-manual.result || 'skipped' }}"
          echo "   Codemagic: ${{ needs.deploy-codemagic.result || 'skipped' }}"
