name: Deploy to App Store (Multi-Method)
on:
  push:
    branches:
      - prod
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      method:
        description: "طريقة النشر"
        required: true
        default: "fastlane-match"
        type: choice
        options:
          - fastlane-match
          - fastlane-legacy
          - shorebird
          - manual
          - codemagic
      track:
        description: "App Store track"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - appstore
      force_patch:
        description: "فرض استخدام Shorebird Patch"
        required: false
        default: false
        type: boolean
      force_release:
        description: "فرض إنشاء إصدار جديد"
        required: false
        default: false
        type: boolean

jobs:
  # Decision Logic
  decision:
    uses: ./.github/workflows/deploy_decision.yml
    with:
      method: ${{ github.event.inputs.method || 'fastlane-match' }}
      track: ${{ github.event.inputs.track || 'testflight' }}
      force_patch: ${{ github.event.inputs.force_patch }}
      force_release: ${{ github.event.inputs.force_release }}
    secrets: inherit

  # Deploy Methods
  deploy-fastlane-match:
    needs: decision
    if: ${{ needs.decision.outputs.method == 'fastlane-match' }}
    uses: ./.github/workflows/deploy_fastlane_match.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      action: ${{ needs.decision.outputs.action }}
      version_name: ${{ needs.decision.outputs.version_name }}
      version_code: ${{ needs.decision.outputs.version_code }}

  deploy-fastlane-legacy:
    needs: decision
    if: ${{ needs.decision.outputs.method == 'fastlane-legacy' }}
    uses: ./.github/workflows/deploy_fastlane_legacy.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      action: ${{ needs.decision.outputs.action }}
      version_name: ${{ needs.decision.outputs.version_name }}
      version_code: ${{ needs.decision.outputs.version_code }}

  deploy-shorebird:
    needs: decision
    if: ${{ needs.decision.outputs.method == 'shorebird' }}
    uses: ./.github/workflows/deploy_shorebird.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      action: ${{ needs.decision.outputs.action }}
      version_name: ${{ needs.decision.outputs.version_name }}
      version_code: ${{ needs.decision.outputs.version_code }}

  deploy-manual:
    needs: decision
    if: ${{ needs.decision.outputs.method == 'manual' }}
    uses: ./.github/workflows/deploy_manual.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      action: ${{ needs.decision.outputs.action }}
      version_name: ${{ needs.decision.outputs.version_name }}
      version_code: ${{ needs.decision.outputs.version_code }}

  deploy-codemagic:
    needs: decision
    if: ${{ needs.decision.outputs.method == 'codemagic' }}
    uses: ./.github/workflows/deploy_codemagic.yml
    with:
      track: ${{ needs.decision.outputs.track }}
      build_mode: release

  # Summary
  summary:
    runs-on: ubuntu-latest
    needs:
      [
        decision,
        deploy-fastlane-match,
        deploy-fastlane-legacy,
        deploy-shorebird,
        deploy-manual,
        deploy-codemagic,
      ]
    if: always()
    steps:
      - run: |
          echo "📋 ملخص التوزيع (App Store):"
          echo "   الإصدار: ${{ needs.decision.outputs.version_code }} (${{ needs.decision.outputs.version_name }})"
          echo "   موجود على App Store: ${{ needs.decision.outputs.version_exists }}"
          echo "   العملية المُنفذة: ${{ needs.decision.outputs.action }}"
          echo "   طريقة النشر: ${{ needs.decision.outputs.method }}"
          echo ""
          echo "🔄 حالة كل طريقة:"
          echo "   Fastlane Match: ${{ needs.deploy-fastlane-match.result || 'skipped' }}"
          echo "   Fastlane Legacy: ${{ needs.deploy-fastlane-legacy.result || 'skipped' }}"
          echo "   Shorebird: ${{ needs.deploy-shorebird.result || 'skipped' }}"
          echo "   Manual: ${{ needs.deploy-manual.result || 'skipped' }}"
          echo "   Codemagic: ${{ needs.deploy-codemagic.result || 'skipped' }}"
