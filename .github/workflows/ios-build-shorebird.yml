name: iOS Build Shorebird
on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: string
        default: "3.41.2"
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      provisioning_profile_name:
        required: true
        type: string
    secrets:
      SHOREBIRD_TOKEN:
        required: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Download Certs Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-certs
          path: ~/certs-artifact/

      - name: 🔧 Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_FILE=$(find ~/certs-artifact -name "*.mobileprovision" -print -quit)
          if [ -f "$PP_FILE" ]; then
            cp "$PP_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "📋 Installed: $(basename "$PP_FILE")"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-${{ inputs.flutter_version }}-macos
          restore-keys: flutter-sdk-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update
      - name: 📦 Build Shorebird Release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PP_NAME: ${{ inputs.provisioning_profile_name }}
        run: |
          echo "📦 Building Shorebird iOS..."
          echo "   Version: ${{ inputs.version_code }} (${{ inputs.version_name }})"
          echo "   Provisioning Profile Name: $PP_NAME"
          # Update ExportOptions.plist with profile name
          perl -i -pe "s/\\\$\(PROVISIONING_PROFILE_NAME\)/$PP_NAME/g" ios/ExportOptions.plist 2>/dev/null || \
          perl -i -pe "s/\\\$\(PROVISIONING_PROFILE_UUID\)/$PP_NAME/g" ios/ExportOptions.plist
          echo "📋 Updated ExportOptions.plist:"
          grep -A1 "com.muein.orders" ios/ExportOptions.plist
          shorebird release ios \
            --flutter-version=${{ inputs.flutter_version }} \
            --dart-define=ENV=prod \
            --flavor=prod \
            --export-options-plist=ios/ExportOptions.plist
          echo "✅ Build completed!"
