name: iOS Build Shorebird
on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: string
        default: "3.41.2"
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      provisioning_profile_name:
        required: true
        type: string
    secrets:
      SHOREBIRD_TOKEN:
        required: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Download Certs Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-certs
          path: ~/certs-artifact/

      - name: 🔧 Install Certificate & Provisioning Profile
        run: |
          # Create keychain
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="temp123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')
          echo "✅ Keychain created"

          # Install Certificate (p12)
          CERT_FILE=$(find ~/certs-artifact -name "*.p12" -print -quit)
          if [ -f "$CERT_FILE" ]; then
            echo "📜 Installing certificate.p12..."
            security import "$CERT_FILE" -k "$KEYCHAIN_NAME" -P "${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }}" -T /usr/bin/codesign || true
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
            echo "✅ Certificate installed"
          else
            echo "⚠️ No .p12 file found in artifact"
          fi

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_FILE=$(find ~/certs-artifact -name "*.mobileprovision" -print -quit)
          if [ -f "$PP_FILE" ]; then
            # Read UUID from the stored file or extract from profile
            if [ -f ~/certs-artifact/profile_uuid.txt ]; then
              PP_UUID=$(cat ~/certs-artifact/profile_uuid.txt)
            else
              PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_FILE")")
            fi
            # Copy with UUID as filename (required by Xcode)
            cp "$PP_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
            echo "📋 Installed Provisioning Profile: ${PP_UUID}.mobileprovision"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-${{ inputs.flutter_version }}-macos
          restore-keys: flutter-sdk-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update
      - name: 📦 Build Shorebird Release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PP_NAME: ${{ inputs.provisioning_profile_name }}
        run: |
          echo "📦 Building Shorebird iOS..."
          echo "   Version: ${{ inputs.version_code }} (${{ inputs.version_name }})"
          echo "   Provisioning Profile Name: $PP_NAME"
          # Update ExportOptions.plist with profile name
          perl -i -pe "s/\\\$\(PROVISIONING_PROFILE_NAME\)/$PP_NAME/g" ios/ExportOptions.plist 2>/dev/null || \
          perl -i -pe "s/\\\$\(PROVISIONING_PROFILE_UUID\)/$PP_NAME/g" ios/ExportOptions.plist
          echo "📋 Updated ExportOptions.plist:"
          grep -A1 "com.muein.orders" ios/ExportOptions.plist
          shorebird release ios \
            --flutter-version=${{ inputs.flutter_version }} \
            --dart-define=ENV=prod \
            --flavor=prod \
            --export-options-plist=ios/ExportOptions.plist
          echo "✅ Build completed!"
