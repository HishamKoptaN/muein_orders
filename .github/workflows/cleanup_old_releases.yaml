name: Cleanup Old Releases
on:
  push:
    branches:
      - main

jobs:
  delete_old_releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS_JSON }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        run: firebase login:ci --no-localhost

      - name: Get app releases
        id: fetch
        run: |
          gcloud firebase appdistribution releases list \
            --app=${{ secrets.FIREBASE_APP_ID }} \
            --limit=100 \
            --sort-by=~createTime \
            --format="value(releaseId)" > releases.txt
          tail -n +6 releases.txt > to_delete.txt # أبقِ آخر 5

      - name: Delete old releases
        run: |
          while IFS= read -r release_id; do
            echo "Deleting release $release_id"
            gcloud firebase appdistribution releases delete $release_id \
              --app=${{ secrets.FIREBASE_APP_ID }} --quiet
          done < to_delete.txt
