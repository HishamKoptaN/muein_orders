name: iOS Patch via Shorebird

on:
  workflow_call:
    inputs:
      version_name:
        required: true
        type: string

jobs:
  patch:
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.41.2", channel: "stable", cache: true }
      - uses: shorebirdtech/setup-shorebird@v1

      - run: |
          [[ -z "$SHOREBIRD_TOKEN" ]] && { echo "❌ SHOREBIRD_TOKEN missing"; exit 1; }
          echo "✅ Token configured"

      - run: flutter pub get
      - run: cd ios && pod install

      - run: |
          echo "🚀 Shorebird Patch for ${{ inputs.version_name }}"
          shorebird patch ios --flavor=prod --release-version="${{ inputs.version_name }}"
          echo "✅ Patch complete"

      - if: always()
        run: |
          echo "📱 Muein Orders iOS Patch"
          echo "🔢 Version: ${{ inputs.version_name }}"
