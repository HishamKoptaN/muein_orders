name: iOS Release via Codemagic
on:
  workflow_call:
    inputs:
      version_name:
        required: true
        type: string
      version_code:
        required: true
        type: string
env:
  CODEMAGIC_WEBHOOK_URL: "https://api.codemagic.io/hooks/69e22d0468ccd4f8805e9a4b"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "$CODEMAGIC_WEBHOOK_URL" == *"YOUR_WEBHOOK_ID"* ]] && { echo "❌ Invalid webhook"; exit 1; }
          echo "🚀 Triggering Codemagic for ${{ inputs.version_name }}+${{ inputs.version_code }}"
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"branch":"'"${{ github.ref_name }}"'","commit":"'"${{ github.sha }}"'","build_type":"release","version_name":"'"${{ inputs.version_name }}"'","version_code":"'"${{ inputs.version_code }}"'"}' \
            "$CODEMAGIC_WEBHOOK_URL"
          echo "✅ Codemagic triggered"
