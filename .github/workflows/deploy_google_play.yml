name: Deploy to Google Play
on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        type: string
      build_number:
        description: "Build number (e.g., 2)"
        required: true
        type: string
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
jobs:
  deploy-android:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || '1.0.0' }}
      BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
      TRACK: ${{ github.event.inputs.track || 'internal' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-
            flutter-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Cache Shorebird
        uses: actions/cache@v4
        with:
          path: ~/.config/shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: shorebird-${{ runner.os }}-
      - run: flutter pub get

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            build/
            android/.gradle
            android/app/build
          key: build-${{ github.run_id }}
          restore-keys: build-
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF

      - env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android \
            --build-name=${{ env.VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=ENV=prod \
            --flavor=prod \
            --artifact=aab \
            -- --enable-experiment=dot-shorthands
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muein.orders
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.TRACK }}
          whatsNewDirectory: distribution/whatsnew
      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties
