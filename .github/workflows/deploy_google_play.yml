name: Deploy to Google Play

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      force_patch:
        description: "فرض استخدام Shorebird Patch"
        required: false
        default: false
        type: boolean
      force_release:
        description: "فرض إنشاء إصدار جديد"
        required: false
        default: false
        type: boolean

jobs:
  check-version:
    uses: ./.github/workflows/check_version_on_playstore.yml
    secrets: inherit

  decide-action:
    runs-on: ubuntu-latest
    needs: check-version
    outputs:
      action: ${{ steps.decide.outputs.action }}
      version_code: ${{ needs.check-version.outputs.version_code }}
      version_name: ${{ needs.check-version.outputs.version_name }}
      version_exists: ${{ needs.check-version.outputs.version_exists }}
    steps:
      - id: decide
        run: |
          VERSION_EXISTS="${{ needs.check-version.outputs.version_exists }}"
          FORCE_PATCH="${{ github.event.inputs.force_patch }}"
          FORCE_RELEASE="${{ github.event.inputs.force_release }}"

          if [ "$FORCE_PATCH" == "true" ]; then
            echo "action=patch" >> $GITHUB_OUTPUT
          elif [ "$FORCE_RELEASE" == "true" ]; then
            echo "action=release" >> $GITHUB_OUTPUT
          elif [ "$VERSION_EXISTS" == "true" ]; then
            echo "action=patch" >> $GITHUB_OUTPUT
          else
            echo "action=release" >> $GITHUB_OUTPUT
          fi

  patch:
    needs: decide-action
    if: ${{ needs.decide-action.outputs.action == 'patch' }}
    uses: ./.github/workflows/shorebird_patch.yml
    with:
      version_code: ${{ needs.decide-action.outputs.version_code }}
      version_name: ${{ needs.decide-action.outputs.version_name }}
    secrets: inherit

  release:
    needs: decide-action
    if: ${{ needs.decide-action.outputs.action == 'release' }}
    uses: ./.github/workflows/shorebird_release.yml
    with:
      version_code: ${{ needs.decide-action.outputs.version_code }}
      version_name: ${{ needs.decide-action.outputs.version_name }}
      track: ${{ github.event.inputs.track || 'internal' }}
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [check-version, decide-action, patch, release]
    if: always()
    steps:
      - run: |
          echo "📋 ملخص:"
          echo "   الإصدار: ${{ needs.decide-action.outputs.version_code }}"
          echo "   العملية: ${{ needs.decide-action.outputs.action }}"
