name: Deploy iOS (Shorebird)
on:
  workflow_call:
    inputs:
      track:
        description: "App Store track"
        required: true
        default: "testflight"
        type: string
      action:
        description: "Action type"
        required: true
        default: "release"
        type: string
      version_name:
        description: "Version name"
        required: true
        type: string
      version_code:
        description: "Version code"
        required: true
        type: string

jobs:
  deploy-ios:
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - uses: shorebirdtech/setup-shorebird@v1

      - run: cd ios && pod install

      - run: |
          if [ "${{ inputs.action }}" == "patch" ]; then
            shorebird patch ios --flavor=prod --release-version="${{ inputs.version_name }}"
          else
            shorebird release ios --flavor=prod --release-version="${{ inputs.version_name }}"
          fi
