name: macOS Debug Unified (Screenshots + Tests + Logs)

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Debug Mode"
        required: true
        default: "screenshots"
        type: choice
        options:
          - screenshots # 📸 Screenshots only
          - integration # 🧪 Integration tests
          - full # 📸🧪 Everything
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      enable_vnc:
        description: "Enable VNC (may not work on headless)"
        required: false
        default: false
        type: boolean

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'full' }}
  ENABLE_VNC: ${{ github.event.inputs.enable_vnc || false }}

jobs:
  # ============================================
  # JOB 1: Setup Environment (Shared)
  # ============================================
  setup:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      device_id: ${{ steps.simulator.outputs.device_id }}
    steps:
      - uses: actions/checkout@v4

      - name: System Info
        run: |
          echo "🍎 macOS Version:"
          sw_vers
          echo ""
          echo "🛠️ Xcode Version:"
          xcodebuild -version
          echo ""
          echo "📱 Available Simulators:"
          xcrun simctl list devices available | head -20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Start Simulator
        id: simulator
        run: |
          echo "🔍 Searching for iPhone simulator..."
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro.*\([A-F0-9-]{36}\)" | grep -v "iPhone.*Pro.*Max" | head -1 | grep -oE '[A-F0-9-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone Pro not found, trying iPhone 16..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone 16 not found, trying any iPhone..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          echo "📱 Starting simulator with ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT

          echo "⏳ Waiting 30 seconds for simulator to initialize..."
          sleep 30

          echo "✅ Simulator ready!"

      - name: Setup Screenshot Capture
        run: |
          echo "📸 Setting up automated screenshots..."
          mkdir -p screenshots
          capture_screen() {
            local name=$1
            echo "📸 Capturing: $name"
            xcrun simctl io booted screenshot screenshots/"${name}_$(date +%H%M%S).png" 2>/dev/null || true
          }
          (
            while true; do
              capture_screen "auto"
              sleep 30
            done
          ) &
          echo "✅ Screenshot capture started"

  # ============================================
  # JOB 2: Build & Screenshots
  # ============================================
  build-and-screenshots:
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 30
    if: github.event.inputs.debug_mode == 'screenshots' || github.event.inputs.debug_mode == 'full' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Reboot Simulator
        run: |
          xcrun simctl shutdown all || true
          sleep 5
          xcrun simctl boot ${{ needs.setup.outputs.device_id }}
          sleep 30

      - name: Build iOS App
        run: |
          echo "🔨 Building iOS app..."
          flutter build ios --${{ env.BUILD_TYPE }} --no-codesign

      - name: Install & Launch App
        run: |
          echo "📱 Installing app on simulator..."
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          echo "✅ App installed!"

          echo "🚀 Launching app..."
          xcrun simctl launch booted com.example.mueinOrders || true

          echo "⏳ App running - capturing screenshots for 2 minutes..."
          sleep 120

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 5

  # ============================================
  # JOB 3: Integration Tests with Full Logs
  # ============================================
  integration-tests:
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 45
    if: github.event.inputs.debug_mode == 'integration' || github.event.inputs.debug_mode == 'full' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Reboot Simulator
        run: |
          xcrun simctl shutdown all || true
          sleep 5
          xcrun simctl boot ${{ needs.setup.outputs.device_id }}
          sleep 30

      - name: 🧪 Run Integration Tests
        run: |
          echo "🧪 Running integration tests..."
          echo "========================================"
          echo "📋 This will capture ALL logs including:"
          echo "   ✅ AppLogger logs"
          echo "   ✅ Firebase Auth logs"
          echo "   ✅ API request/response logs"
          echo "   ✅ Error logs with stack traces"
          echo "   ✅ Screenshots at each step"
          echo "========================================"

          # Run integration test and capture ALL output
          flutter test integration_test/auth_flow_test.dart \
            --device-id booted \
            --verbose \
            --reporter expanded \
            2>&1 | tee integration_test_output.log

          echo "✅ Integration tests completed"

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_number }}
          path: |
            integration_test_output.log
            screenshots/
          retention-days: 7

      - name: 📋 Print Test Summary
        if: always()
        run: |
          echo "========================================"
          echo "📊 TEST SUMMARY"
          echo "========================================"
          if [ -f integration_test_output.log ]; then
            echo "📋 Last 100 lines of logs:"
            tail -100 integration_test_output.log
          fi

  # ============================================
  # JOB 4: VNC Access (Optional - may not work)
  # ============================================
  vnc-access:
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 20
    if: github.event.inputs.enable_vnc == 'true'
    steps:
      - name: Setup VNC (Experimental)
        run: |
          echo "🖥️ Setting up VNC (Experimental - may not work on headless)..."
          VNC_PASS="debug123"

          # Enable Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -privs -all -allowAccessFor -allUsers \
            -restart -agent || true

          # Set VNC password
          sudo perl -e '
            my $pwd = "'"$VNC_PASS"'";
            my @key = (23, 82, 107, 6, 35, 78, 88, 7);
            my $hash = "";
            for (my $i = 0; $i < 8; $i++) {
              my $c = substr($pwd, $i, 1);
              $c = "\0" if $c eq "";
              $hash .= chr(ord($c) ^ $key[$i]);
            }
            print $hash;
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null || true

          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt || true

          echo "⚠️ VNC may not work in headless GitHub Actions runners"
          echo "📸 Use screenshots as backup debugging method"

      - name: Keep Alive for VNC
        run: |
          echo "⏳ Keeping runner alive for 10 minutes..."
          sleep 600

  # ============================================
  # Cleanup Job
  # ============================================
  cleanup:
    runs-on: macos-latest
    needs: [build-and-screenshots, integration-tests, vnc-access]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 🧹 Cleanup
        run: |
          echo "🧹 Cleaning up simulators..."
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          echo "✅ Cleanup complete"
