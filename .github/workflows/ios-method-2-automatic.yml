name: iOS Method 2 - Automatic Signing
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      flutter_version:
        required: false
        type: string
        default: "3.41.2"
    outputs:
      status:
        value: ${{ jobs.build.outputs.status }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Setup API Key
        id: api_key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          echo "key_id=${{ secrets.APP_STORE_CONNECT_KEY_ID }}" >> $GITHUB_OUTPUT
          echo "issuer_id=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"

      - uses: shorebirdtech/setup-shorebird@v1
      - run: flutter pub get
      - run: cd ios && pod install --repo-update

      - name: 📝 Fix ExportOptions.plist
        run: |
          plutil -remove provisioningProfiles ios/ExportOptions.plist 2>/dev/null || true
          plutil -replace method -string "app-store" ios/ExportOptions.plist 2>/dev/null || true
          plutil -replace signingStyle -string "automatic" ios/ExportOptions.plist 2>/dev/null || true

      - name: 📦 Build with Shorebird
        id: build
        continue-on-error: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          APP_STORE_CONNECT_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          APP_STORE_CONNECT_KEY_ID: ${{ steps.api_key.outputs.key_id }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.api_key.outputs.issuer_id }}
        run: |
          shorebird release ios \
            --flutter-version=${{ inputs.flutter_version }} \
            --dart-define=ENV=prod --flavor=prod && {
              echo "status=success" >> $GITHUB_OUTPUT
            } || echo "status=failed" >> $GITHUB_OUTPUT
