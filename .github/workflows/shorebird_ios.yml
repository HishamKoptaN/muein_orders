name: iOS Shorebird Auto-Patch
on:
  workflow_call:
    inputs:
      action:
        type: string
        required: true
jobs:
  ios:
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - uses: shorebirdtech/setup-shorebird@v1
      - run: cd ios && pod install
      - id: latest
        run: |
          VER=$(shorebird release list --flavor=prod 2>/dev/null | grep 'ios' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [[ -z "$VER" ]] && { echo "No iOS releases found. Create via Codemagic first."; exit 1; }
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Patching iOS $VER"
      - run: shorebird patch ios --flavor=prod --release-version="${{ steps.latest.outputs.version }}"
