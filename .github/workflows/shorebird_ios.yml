name: Shorebird iOS

on:
  workflow_call:
    inputs:
      action:
        type: string
        required: true

jobs:
  ios:
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - uses: shorebirdtech/setup-shorebird@v1
      - run: cd ios && pod install
      - id: get_latest
        run: |
          LATEST=$(shorebird release list --flavor=prod 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $1}')
          if [[ -z "$LATEST" ]]; then
            echo "has_releases=false" >> $GITHUB_OUTPUT
            echo "No releases found - will create new release"
          else
            echo "has_releases=true" >> $GITHUB_OUTPUT
            echo "latest=$LATEST" >> $GITHUB_OUTPUT
            echo "Latest release: $LATEST"
          fi
      - if: steps.get_latest.outputs.has_releases == 'true'
        run: shorebird patch ios --flavor=prod --release-version="${{ steps.get_latest.outputs.latest }}"
      - if: steps.get_latest.outputs.has_releases == 'false'
        run: shorebird release ios --flavor=prod
