name: Check Version on App Store

on:
  workflow_call:
    outputs:
      version_exists:
        description: "Whether the version already exists on App Store"
        value: ${{ jobs.check-version.outputs.version_exists }}
      version_code:
        description: "Current version code"
        value: ${{ jobs.check-version.outputs.version_code }}
      version_name:
        description: "Current version name"
        value: ${{ jobs.check-version.outputs.version_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_exists: ${{ steps.check-version.outputs.exists }}
      version_code: ${{ steps.get-version.outputs.version_code }}
      version_name: ${{ steps.get-version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - id: get-version
        run: |
          # استخراج versionCode و versionName من pubspec.yaml
          VERSION_CODE=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml | grep -oP '\+\K[0-9]+' || echo "1")
          VERSION_NAME=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)

          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          echo "📱 الإصدار الحالي:"
          echo "   versionCode: $VERSION_CODE"
          echo "   versionName: $VERSION_NAME"

      - name: Check Version on App Store Connect
        id: check-version
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          BUNDLE_ID: com.muein.orders
          VERSION_CODE: ${{ steps.get-version.outputs.version_code }}
        run: |
          echo "🔍 جاري فحص الإصدار على App Store Connect..."
          echo "   Bundle ID: $BUNDLE_ID"
          echo "   versionCode: $VERSION_CODE"

          # إنشاء JWT Token للمصادقة
          JWT_HEADER=$(echo -n '{"alg":"ES256","kid":"'$APP_STORE_CONNECT_KEY_ID'","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          JWT_PAYLOAD=$(echo -n '{"iss":"'$APP_STORE_CONNECT_ISSUER_ID'","iat":'$(date +%s)',"exp":'$(($(date +%s) + 1200))',"aud":"appstoreconnect-v1"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          JWT_SIGNING_INPUT="$JWT_HEADER.$JWT_PAYLOAD"

          # كتابة المفتاح الخاص في ملف مؤقت
          echo "$APP_STORE_CONNECT_API_KEY" > /tmp/asc_key.p8

          # توقيع الـ JWT
          JWT_SIGNATURE=$(openssl dgst -sha256 -sign /tmp/asc_key.p8 -binary <<< "$JWT_SIGNING_INPUT" | base64 -w0 | tr '+/' '-_' | tr -d '=')

          # حذف الملف المؤقت
          rm /tmp/asc_key.p8

          JWT_TOKEN="$JWT_HEADER.$JWT_PAYLOAD.$JWT_SIGNATURE"

          # البحث عن التطبيق
          APP_RESPONSE=$(curl -s -H "Authorization: Bearer $JWT_TOKEN" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=$BUNDLE_ID")

          APP_ID=$(echo "$APP_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$APP_ID" ]; then
            echo "⚠️ التطبيق غير موجود على App Store Connect"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # البحث عن الإصدارات
          VERSIONS_RESPONSE=$(curl -s -H "Authorization: Bearer $JWT_TOKEN" \
            "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/appStoreVersions")

          EXISTS=$(echo "$VERSIONS_RESPONSE" | grep -q "versionString.*$VERSION_CODE" && echo "true" || echo "false")

          echo "exists=$EXISTS" >> $GITHUB_OUTPUT

          if [ "$EXISTS" == "true" ]; then
            echo "⚠️ الإصدار $VERSION_CODE موجود بالفعل على App Store Connect!"
          else
            echo "✅ الإصدار $VERSION_CODE غير موجود على App Store Connect"
          fi
