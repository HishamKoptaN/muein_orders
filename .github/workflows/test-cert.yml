name: Test Create Apple Certificate

on:
  push:
    branches: [ prods ]

jobs:
  test-cert-generation:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - shell: bash
        run: |
          dotnet tool install --global AppleDev.Tools --version 0.5.0
          
          apple ci certificates create \
            --api-key-id "3ZD59Y97UM" \
            --api-issuer-id "487919a3-70a5-4992-af37-d75eb388c881" \
            --api-private-key "ios/api_private_key.p8" \
            --type "Distribution"
            
      - name: Verify Certificate Success
        shell: bash
        run: |
          echo "=== تم اختبار وإنشاء الشهادة بنجاح تام عبر الـ API! ==="