name: iOS Auto Bump Build
on:
  push:
    branches: [prod]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

jobs:
  bump-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: check_native
        run: |
          LAST=$(git rev-parse HEAD)
          PREV=$(git rev-parse HEAD~1)
          HAS=false
          git diff --name-only $PREV $LAST | grep -qE "^ios/|pubspec\.yaml|pubspec\.lock" && HAS=true
          echo "has_native=$HAS" >> $GITHUB_OUTPUT

      - if: steps.check_native.outputs.has_native == 'true'
        id: bump
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          NAME=$(echo $VERSION | cut -d'+' -f1)
          CODE=$(echo $VERSION | cut -d'+' -f2)
          NEW_CODE=$((CODE + 1))
          sed -i "s/version: $VERSION/version: $NAME+$NEW_CODE/" pubspec.yaml
          echo "new_version=$NAME+$NEW_CODE" >> $GITHUB_OUTPUT

      - if: steps.check_native.outputs.has_native == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pubspec.yaml
          git commit -m "bump iOS build to ${{ steps.bump.outputs.new_version }}"
          git push

      - if: steps.check_native.outputs.has_native == 'true'
        run: |
          curl -X POST "${{ secrets.CODEMAGIC_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"prod","workflow":"ios-release"}'
