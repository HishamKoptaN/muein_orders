name: Check Native Changes - Android

on:
  workflow_call:
    outputs:
      has_native_changes:
        description: "Whether the commit contains Android native changes"
        value: ${{ jobs.check.outputs.has_native_changes }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_native_changes: ${{ steps.detect.outputs.has_native_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          echo "🔍 فحص التغييرات النيتف (Android) في آخر commit..."

          # فحص آخر commit فقط
          NATIVE_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          echo "📄 الملفات المتغيرة في آخر commit:"
          echo "$NATIVE_FILES"

          HAS_NATIVE="false"

          # فحص مجلد Android
          if echo "$NATIVE_FILES" | grep -qE "^android/"; then
            echo "   ⚠️ وجدت تغييرات في مجلد Android"
            HAS_NATIVE="true"
          fi

          # فحص pubspec.yaml (يؤثر على جميع المنصات)
          if echo "$NATIVE_FILES" | grep -qE "pubspec\.yaml|pubspec\.lock"; then
            echo "   ⚠️ وجدت تغييرات في pubspec.yaml/pubspec.lock (dependencies)"
            HAS_NATIVE="true"
          fi

          # فحص ملفات Gradle
          if echo "$NATIVE_FILES" | grep -qE "\.gradle|build\.gradle|settings\.gradle|AndroidManifest|gradle\.properties"; then
            echo "   ⚠️ وجدت تغييرات في Gradle أو AndroidManifest"
            HAS_NATIVE="true"
          fi

          # فحص ملفات Shorebird.yaml
          if echo "$NATIVE_FILES" | grep -qE "shorebird\.yaml"; then
            echo "   ⚠️ وجدت تغييرات في shorebird.yaml"
            HAS_NATIVE="true"
          fi

          if [ "$HAS_NATIVE" == "true" ]; then
            echo "❌ توجد تغييرات Native (Android) - يجب إنشاء Release جديد"
          else
            echo "✅ لا توجد تغييرات Native (Android) - يمكن استخدام Patch"
          fi

          echo "has_native_changes=$HAS_NATIVE" >> $GITHUB_OUTPUT
