name: Auto Deploy iOS

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      force_release:
        type: boolean
        default: false
      force_patch:
        type: boolean
        default: false

jobs:
  detect:
    uses: ./.github/workflows/ios_detect.yml
    with:
      force_release: ${{ github.event.inputs.force_release }}
      force_patch: ${{ github.event.inputs.force_patch }}

  release:
    needs: detect
    if: needs.detect.outputs.build_type == 'release'
    uses: ./.github/workflows/ios_release.yml
    with:
      version_name: ${{ needs.detect.outputs.version_name }}
      version_code: ${{ needs.detect.outputs.version_code }}

  patch:
    needs: detect
    if: needs.detect.outputs.build_type == 'patch'
    uses: ./.github/workflows/ios_patch.yml
    with:
      version_name: ${{ needs.detect.outputs.version_name }}
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [detect, release, patch]
    if: always()
    steps:
      - run: |
          BUILD_TYPE="${{ needs.detect.outputs.build_type }}"
          VERSION_NAME="${{ needs.detect.outputs.version_name }}"
          VERSION_CODE="${{ needs.detect.outputs.version_code }}"

          echo "Type: $BUILD_TYPE"
          echo "Version: $VERSION_NAME+$VERSION_CODE"

          if [[ "$BUILD_TYPE" == "release" ]]; then
            echo "   Codemagic: ${{ needs.release.result }}"
          else
            echo "   Shorebird Patch: ${{ needs.patch.result }}"
          fi

          echo "╚════════════════════════════════════════════════╝"

          echo ""
          echo "📊 حالة الوظائف:"
          echo "   فحص البناء: ${{ needs.detect.result }}"

          if [[ "$BUILD_TYPE" == "release" ]]; then
            echo "   Codemagic: ${{ needs.release.result }}"
          else
            echo "   Shorebird Patch: ${{ needs.patch.result }}"
          fi
