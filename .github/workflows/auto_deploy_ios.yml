name: Auto Deploy iOS (Release or Patch)

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      force_release:
        description: "فرض بناء إصدار جديد (Release)"
        required: false
        type: boolean
        default: false
      force_patch:
        description: "فرض بناء Patch"
        required: false
        type: boolean
        default: false

env:
  # ⚠️ تنبيه: هذه القيم حساسة. يفضل استخدام GitHub Secrets في الإنتاج
  CODEMAGIC_WEBHOOK_URL: "https://api.codemagic.io/hooks/69e22d0468ccd4f8805e9a4b"
  SHOREBIRD_TOKEN: "eyJyZWZyZXNoX3Rva2VuIjoiMS8vMDNzbWlSRGNHanliM0NnWUlBUkFBR0FNU053Ri1MOUlyS0VqUzhlNW1pRk9HVFVfbVl4LUliMm9ObmZaNUxTZm15R3JxLWlRQUp1VEZiVlktMWtPMjFCZ1M3STNaRGxlTWZxNCIsImF1dGhfcHJvdmlkZXIiOiJnb29nbGUifQ=="
  APP_STORE_APP_ID: "6761682256"

jobs:
  detect-build-type:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.decision.outputs.build_type }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      has_native_changes: ${{ steps.native_check.outputs.has_native_changes }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📱 Extract Version Info
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📱 إصدار التطبيق: $VERSION_NAME+$VERSION_CODE"

      - name: 🔍 Check for Native Changes
        id: native_check
        run: |
          # التحقق من التغييرات في الملفات الأصلية (Native)
          NATIVE_PATHS="ios/ android/ linux/ macos/ windows/ web/"

          # الحصول على آخر commit
          LAST_COMMIT=$(git rev-parse HEAD)
          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)

          echo "🔍 فحص التغييرات بين $PREVIOUS_COMMIT و $LAST_COMMIT"

          HAS_NATIVE=false
          for path in $NATIVE_PATHS; do
            if git diff --name-only $PREVIOUS_COMMIT $LAST_COMMIT | grep -q "^$path"; then
              echo "⚠️ تم العثور على تغييرات في: $path"
              HAS_NATIVE=true
            fi
          done

          echo "has_native_changes=$HAS_NATIVE" >> $GITHUB_OUTPUT

          if [[ "$HAS_NATIVE" == "true" ]]; then
            echo "🔴 تم اكتشاف تغييرات Native - يتطلب إصدار جديد"
          else
            echo "🟢 لا توجد تغييرات Native - يمكن استخدام Patch"
          fi

      - name: 🌐 Check App Store Version
        id: store_check
        run: |
          # جلب آخر إصدار من App Store
          APP_ID="$APP_STORE_APP_ID"

          if [[ -z "$APP_ID" ]]; then
            echo "⚠️ APP_STORE_APP_ID غير مضبوط - سيتم استخدام المنطق الافتراضي"
            echo "store_version_code=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # جلب معلومات التطبيق من App Store
          STORE_INFO=$(curl -s "https://itunes.apple.com/lookup?id=$APP_ID" || echo '{}')
          STORE_VERSION=$(echo "$STORE_INFO" | jq -r '.results[0].version // "0.0.0"')

          echo "📱 إصدار App Store: $STORE_VERSION"

          # تحويل الإصدار إلى رقم للمقارنة
          STORE_VERSION_CODE=$(echo "$STORE_VERSION" | awk -F. '{print ($1*1000000)+($2*1000)+$3}')
          echo "store_version_code=$STORE_VERSION_CODE" >> $GITHUB_OUTPUT

      - name: 🤔 Decide Build Type
        id: decision
        run: |
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          HAS_NATIVE="${{ steps.native_check.outputs.has_native_changes }}"
          STORE_VERSION="${{ steps.store_check.outputs.store_version_code }}"

          # قرار بناء على المنطق التالي:
          # 1. إذا كان version_code = 1 → إصدار جديد (أول بناء)
          # 2. إذا كانت هناك تغييرات Native → إصدار جديد
          # 3. إذا كان إصدار App Store مختلفًا → إصدار جديد
          # 4. خلاف ذلك → Patch

          if [[ "$VERSION_CODE" == "1" ]] || [[ -z "$VERSION_CODE" ]]; then
            BUILD_TYPE="release"
            REASON="أول بناء (version_code=1)"
          elif [[ "$HAS_NATIVE" == "true" ]]; then
            BUILD_TYPE="release"
            REASON="تغييرات Native مكتشفة"
          else
            BUILD_TYPE="patch"
            REASON="لا توجد تغييرات Native - إصلاحات Dart فقط"
          fi

          # التحقق من المتغيرات اليدوية (للتجاوز)
          if [[ "${{ github.event.inputs.force_release }}" == "true" ]]; then
            BUILD_TYPE="release"
            REASON="تجاوز يدوي: Force Release"
          elif [[ "${{ github.event.inputs.force_patch }}" == "true" ]]; then
            BUILD_TYPE="patch"
            REASON="تجاوز يدوي: Force Patch"
          fi

          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "🎯 نوع البناء: $BUILD_TYPE"
          echo "📋 السبب: $REASON"

  # تشغيل Codemagic للإصدار الجديد
  trigger-codemagic-release:
    needs: detect-build-type
    if: needs.detect-build-type.outputs.build_type == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Codemagic Build (Release)
        run: |
          # التحقق من ضبط Webhook URL
          if [[ "$CODEMAGIC_WEBHOOK_URL" == *"YOUR_WEBHOOK_ID"* ]]; then
            echo "⚠️ يرجى تحديث CODEMAGIC_WEBHOOK_URL بقيمة صحيحة"
            echo "💡 احصل عليه من: Codemagic → App Settings → Webhooks"
            exit 1
          fi

          echo "🚀 تشغيل بناء الإصدار الجديد عبر Codemagic..."
          echo "📱 الإصدار: ${{ needs.detect-build-type.outputs.version_name }}+${{ needs.detect-build-type.outputs.version_code }}"

          # إرسال طلب إلى Codemagic Webhook
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "branch": "'"${{ github.ref_name }}"'",
              "commit": "'"${{ github.sha }}"'",
              "build_type": "release",
              "version_name": "'"${{ needs.detect-build-type.outputs.version_name }}"'",
              "version_code": "'"${{ needs.detect-build-type.outputs.version_code }}"'"
            }' \
            "$CODEMAGIC_WEBHOOK_URL" || echo '{"error": "failed"}')

          echo "📋 استجابة Codemagic:"
          echo "$RESPONSE"

          echo "✅ تم إرسال طلب البناء إلى Codemagic"
          echo "🔗 تحقق من حالة البناء في لوحة تحكم Codemagic"

  # تشغيل Shorebird Patch (بدون Codemagic)
  shorebird-patch:
    needs: detect-build-type
    if: needs.detect-build-type.outputs.build_type == 'patch'
    runs-on: macos-latest # Shorebird يتطلب macOS لبناء iOS
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: 🐦 Install Shorebird CLI
        run: |
          echo "🐦 تثبيت Shorebird CLI..."
          # تثبيت Shorebird عبر المثبت الرسمي
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/shorebirdtech/shorebird/releases/latest/download/shorebird-installer.sh | sh
          # إضافة Shorebird إلى PATH
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird --version
          echo "✅ Shorebird CLI مثبت"

      - name: 🔐 Login to Shorebird
        run: |
          # التحقق من ضبط Shorebird Token
          if [[ "$SHOREBIRD_TOKEN" == *"YOUR_SHOREBIRD"* ]]; then
            echo "⚠️ يرجى تحديث SHOREBIRD_TOKEN بقيمة صحيحة"
            echo "💡 احصل عليه من: https://console.shorebird.dev/"
            exit 1
          fi

          echo "🔐 تسجيل الدخول إلى Shorebird..."
          shorebird login --token "$SHOREBIRD_TOKEN"
          echo "✅ تم تسجيل الدخول"

      - name: 📦 Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install

      - name: 🚀 Run Shorebird Patch
        run: |
          VERSION_NAME="${{ needs.detect-build-type.outputs.version_name }}"

          echo "🚀 تشغيل Shorebird Patch للإصدار: $VERSION_NAME"
          echo "📱 هذا البناء يستخدم Shorebird مباشرة (بدون Codemagic)"

          # تشغيل Shorebird Patch
          shorebird patch \
            --platforms=ios \
            --release-version="$VERSION_NAME" \
            --verbose

          echo "✅ Shorebird Patch اكتمل بنجاح!"

      - name: 📋 Patch Summary
        if: always()
        run: |
          echo "📋 ملخص Patch:"
          echo "📱 التطبيق: Muein Orders"
          echo "🔢 الإصدار: ${{ needs.detect-build-type.outputs.version_name }}+${{ needs.detect-build-type.outputs.version_code }}"
          echo "🐦 النوع: Shorebird Patch (GitHub Actions)"
          echo "💰 الدقائق الموفرة: لم يتم استخدام Codemagic"

  # ملخص البناء
  build-summary:
    runs-on: ubuntu-latest
    needs: [detect-build-type, trigger-codemagic-release, shorebird-patch]
    if: always()
    steps:
      - name: 📋 Final Build Summary
        run: |
          BUILD_TYPE="${{ needs.detect-build-type.outputs.build_type }}"
          VERSION_NAME="${{ needs.detect-build-type.outputs.version_name }}"
          VERSION_CODE="${{ needs.detect-build-type.outputs.version_code }}"

          echo "╔════════════════════════════════════════════════╗"
          echo "║         📱 iOS Build Summary                   ║"
          echo "╠════════════════════════════════════════════════╣"
          echo "║  الإصدار: $VERSION_NAME+$VERSION_CODE"
          echo "║  نوع البناء: $BUILD_TYPE"
          echo "╠════════════════════════════════════════════════╣"

          if [[ "$BUILD_TYPE" == "release" ]]; then
            echo "║  🚀 تم تشغيل: Codemagic (Release Build)"
            echo "║  📤 سيتم نشره على: TestFlight"
            echo "║  🔗 تحقق من Codemagic للتفاصيل"
          else
            echo "║  🐦 تم تشغيل: Shorebird Patch"
            echo "║  ⚡ تحديث سريع بدون مراجعة App Store"
            echo "║  💰 تم توفير دقائق Codemagic"
          fi

          echo "╚════════════════════════════════════════════════╝"

          # عرض حالة الوظائف
          echo ""
          echo "📊 حالة الوظائف:"
          echo "   فحص البناء: ${{ needs.detect-build-type.result }}"

          if [[ "$BUILD_TYPE" == "release" ]]; then
            echo "   Codemagic: ${{ needs.trigger-codemagic-release.result }}"
          else
            echo "   Shorebird Patch: ${{ needs.shorebird-patch.result }}"
          fi
