name: Shorebird Patch
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-${{ runner.os }}
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Cache Dart/Flutter Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}
          restore-keys: flutter-deps-

      - name: Cache Shorebird
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-${{ runner.os }}-

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Cache Patch Artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            .dart_tool/build
          key: patch-${{ github.sha }}-${{ inputs.version_code }}-${{ runner.os }}
          restore-keys: patch-${{ runner.os }}-

      - run: flutter pub get
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF
      - env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "🔧 تنفيذ Shorebird Patch..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"

          shorebird patch android \
            --dart-define=ENV=prod \
            --flavor=prod \
            --release-version=$VERSION_NAME+$VERSION_CODE
      - run: |
          echo "✅ تم إرسال الباتش بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   رابط متابعة الباتش: https://console.shorebird.dev/"
      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties
