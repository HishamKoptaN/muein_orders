name: iOS Method 4 - Direct Flutter Build
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      flutter_version:
        required: false
        type: string
        default: "3.41.2"
      track:
        required: true
        type: string
    outputs:
      status:
        value: ${{ jobs.build.outputs.status }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Certificates
        run: |
          CERTS_DIR="${{ github.workspace }}"
          security create-keychain -p "temp123" "build.keychain" || true
          security unlock-keychain -p "temp123" "build.keychain" || true

          if [ -f "$CERTS_DIR/certificate.p12" ]; then
            security import "$CERTS_DIR/certificate.p12" -k "build.keychain" \
              -P "${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }}" -T /usr/bin/codesign || true
          fi

          PP_FILE=$(find "$CERTS_DIR" -name "*.mobileprovision" -print -quit)
          if [ -f "$PP_FILE" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"

      - run: flutter pub get
      - run: cd ios && pod install --repo-update

      - name: 📦 Build IPA Directly
        id: build
        run: |
          flutter build ipa --release --flavor=prod --dart-define=ENV=prod \
            --export-options-plist=ios/ExportOptions.plist && {
              echo "status=success" >> $GITHUB_OUTPUT
            } || echo "status=failed" >> $GITHUB_OUTPUT

      - name: 📤 Upload to App Store
        if: steps.build.outputs.status == 'success'
        run: |
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" || true
