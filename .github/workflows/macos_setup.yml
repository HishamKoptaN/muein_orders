name: "[Reusable] macOS Setup"

on:
  workflow_call:
    inputs:
      build_type:
        description: "Build type (debug/release)"
        required: false
        default: "debug"
        type: string
    outputs:
      device_id:
        description: "Simulator device ID"
        value: ${{ jobs.setup.outputs.device_id }}
      build_type:
        description: "Build type used"
        value: ${{ inputs.build_type }}

jobs:
  setup:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      device_id: ${{ steps.simulator.outputs.device_id }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "🍎 macOS Version:"
          sw_vers
          echo ""
          echo "🛠️ Xcode Version:"
          xcodebuild -version
          echo ""
          echo "📱 Available Simulators:"
          xcrun simctl list devices available | head -20
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true
      - run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Start Simulator
        id: simulator
        run: |
          echo "🔍 Searching for iPhone simulator..."
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro.*\([A-F0-9-]{36}\)" | grep -v "iPhone.*Pro.*Max" | head -1 | grep -oE '[A-F0-9-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone Pro not found, trying iPhone 16..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "⚠️ iPhone 16 not found, trying any iPhone..."
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi

          echo "📱 Starting simulator with ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT

          echo "⏳ Waiting 30 seconds for simulator to initialize..."
          sleep 30
          echo "✅ Simulator ready!"

      - name: Setup Screenshot Capture
        run: |
          echo "📸 Setting up automated screenshots..."
          mkdir -p screenshots
          capture_screen() {
            local name=$1
            echo "📸 Capturing: $name"
            xcrun simctl io booted screenshot screenshots/"${name}_$(date +%H%M%S).png" 2>/dev/null || true
          }
          (
            while true; do
              capture_screen "auto"
              sleep 30
            done
          ) &
