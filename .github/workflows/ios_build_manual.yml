name: iOS Build (Manual - No Shorebird)

on:
  workflow_dispatch:
    inputs:
      version_code:
        required: true
        type: string
        description: "رقم الإصدار (مثال: 42)"
      version_name:
        required: true
        type: string
        description: "اسم الإصدار (مثال: 1.2.3)"
      track:
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: "testflight"
        description: "القناة"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Certificates & Provisioning Profile
        run: |
          echo "🔧 Installing certificates from repo root..."
          CERTS_DIR="${{ github.workspace }}"

          # Create keychain
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="temp123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

          # Install Certificate (from .cer and .key files)
          if [ -f "$CERTS_DIR/certificate.cer" ] && [ -f "$CERTS_DIR/private.key" ]; then
            echo "📜 Installing certificate from .cer + .key..."
            openssl x509 -in "$CERTS_DIR/certificate.cer" -inform DER -out /tmp/certificate.pem -outform PEM
            openssl rsa -in "$CERTS_DIR/private.key" -out /tmp/private.pem 2>/dev/null || cat "$CERTS_DIR/private.key" > /tmp/private.pem
            openssl pkcs12 -export -out /tmp/certificate.p12 \
              -inkey /tmp/private.pem \
              -in /tmp/certificate.pem \
              -password pass:${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }} 2>/dev/null
            security import /tmp/certificate.p12 -k "$KEYCHAIN_NAME" \
              -P "${{ secrets.IOS_CERTIFICATE_PASSWORD || '123456' }}" -T /usr/bin/codesign || true
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
            rm -f /tmp/certificate.pem /tmp/private.pem /tmp/certificate.p12
            echo "✅ Certificate installed"
          fi

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_FILE=$(find "$CERTS_DIR" -maxdepth 1 -name "*.mobileprovision" -print -quit)
          if [ -f "$PP_FILE" ]; then
            PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_FILE")")
            PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PP_FILE")")
            cp "$PP_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
            echo "provisioning_profile_name=$PP_NAME" >> $GITHUB_ENV
            echo "provisioning_profile_uuid=$PP_UUID" >> $GITHUB_ENV
            echo "✅ Installed: $PP_NAME"
          fi

      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-macos
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update

      - name: 📦 Build IPA (Manual Signing)
        run: |
          echo "📦 Building IPA with manual signing..."
          echo "Provisioning Profile: $provisioning_profile_name"
          echo "UUID: $provisioning_profile_uuid"
          
          flutter build ipa \
            --release \
            --flavor=prod \
            --dart-define=ENV=prod \
            --export-options-plist=ios/ExportOptions.plist

      - name: 📤 Upload to App Store
        run: |
          echo "📤 Uploading to ${{ inputs.track }}..."
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --verbose || true

      - name: 📎 Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.version_name }}+${{ inputs.version_code }}
          path: build/ios/ipa/*.ipa
          retention-days: 7
