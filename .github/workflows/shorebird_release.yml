name: Shorebird Release
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "internal"
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-${{ runner.os }}
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Cache Dart/Flutter Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}-${{ runner.os }}
          restore-keys: |
            flutter-deps-${{ hashFiles('pubspec.lock') }}-
            flutter-deps-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'android/build.gradle.kts') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'android/gradle.properties') }}-${{ runner.os }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Cache Shorebird
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: |
            shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
            shorebird-${{ runner.os }}-

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Cache Build Outputs
        uses: actions/cache@v4
        with:
          path: |
            build/
            android/.gradle
            android/app/build
            .dart_tool/build
          key: build-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}-${{ runner.os }}
          restore-keys: |
            build-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}-
            build-${{ runner.os }}-

      - run: flutter pub get

      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks

      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF

      - name: Check Shorebird Release Exists
        id: check-release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "🔍 التحقق من وجود إصدار Shorebird..."
          echo "   للإصدار: $VERSION_NAME+$VERSION_CODE"

          # جلب قائمة الإصدارات
          echo "📋 جلب قائمة الإصدارات..."
          shorebird releases list || true

          # فحص باستخدام shorebird releases list --json إذا كان متوفراً
          # أو استخدام grep مع أنماط متعددة
          TARGET_VERSION="$VERSION_NAME+$VERSION_CODE"

          # محاولة 1: فحص باستخدام grep مباشر
          if shorebird releases list 2>/dev/null | grep -E "(android.*$TARGET_VERSION|$TARGET_VERSION.*android)" > /dev/null; then
            echo "✅ الإصدار $TARGET_VERSION موجود (android) - سيتم التحميل"
            echo "release_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # محاولة 2: فحص عام
          if shorebird releases list 2>/dev/null | grep -F "$TARGET_VERSION" > /dev/null; then
            echo "✅ الإصدار $TARGET_VERSION موجود - سيتم التحميل"
            echo "release_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ الإصدار غير موجود - سيتم البناء"
          echo "release_exists=false" >> $GITHUB_OUTPUT

      - name: Download Shorebird Release (if exists)
        if: steps.check-release.outputs.release_exists == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "📥 تحميل إصدار Shorebird الموجود..."
          echo "   للإصدار: $VERSION_NAME+$VERSION_CODE"

          # إنشاء المجلد
          mkdir -p build/app/outputs/bundle/prodRelease

          # تحميل الإصدار باستخدام shorebird
          shorebird releases download \
            --version=$VERSION_NAME+$VERSION_CODE \
            --platform=android \
            --output=build/app/outputs/bundle/prodRelease/app-prod-release.aab

      - name: Shorebird Release (if not exists)
        if: steps.check-release.outputs.release_exists != 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "📦 إنشاء Shorebird Release جديد..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"
          shorebird release android \
            --dart-define=ENV=prod \
            --flavor=prod \
            --artifact=aab || {
              echo "⚠️ فشل إنشاء الإصدار - ربما يوجد بالفعل؟"
              exit 1
            }

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muein.orders
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.TRACK }}

      - name: Report Release Success
        run: |
          echo "✅ تم إنشاء الإصدار ورفعه بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   القناة: ${{ env.TRACK }}"

      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties
