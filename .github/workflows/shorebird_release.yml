name: Shorebird Release
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: true
        type: string
        default: "internal"
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-
            flutter-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/cache@v4
        with:
          path: ~/.config/shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: shorebird-${{ runner.os }}-

      - run: flutter pub get

      - uses: actions/cache@v4
        with:
          path: |
            build/
            android/.gradle
            android/app/build
          key: build-${{ github.run_id }}
          restore-keys: build-

      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks

      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF

      - name: Shorebird Release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "📦 إنشاء Shorebird Release جديد..."
          echo "   للإصدار: $VERSION_CODE ($VERSION_NAME)"

          shorebird release android \
            --dart-define=ENV=prod \
            --flavor=prod \
            --artifact=aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muein.orders
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.TRACK }}
          whatsNewDirectory: distribution/whatsnew

      - name: Report Release Success
        run: |
          echo "✅ تم إنشاء الإصدار ورفعه بنجاح!"
          echo "   الإصدار: $VERSION_CODE ($VERSION_NAME)"
          echo "   القناة: ${{ env.TRACK }}"

      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties
