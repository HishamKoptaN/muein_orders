plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.mubin.app.orders"
    compileSdk = 36
    ndkVersion "27.0.12077973"

    // ------ flavors تم إزالتها مؤقتًا لتفادي مشاكل البناء ------
    // ملاحظة: لو كان لديك موارد/شفرة ضمن src/dev أو src/staging تأكد
    // أنها لا تعتمد على الـ flavors أو انقلها للمصدر الرئيسي (src/main).

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        applicationId = "com.mubin.app.orders"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
         ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
          }
        // اضفنا اسم التطبيق الافتراضي بدل resValue لكل flavor
        resValue "string", "app_name", "Mubin Orders"
    }
    signingConfigs {
        release {
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}

flutter {
    source = "../.."
}

apply plugin: 'com.google.gms.google-services'